   * with a small visual gap. Decision diamonds are inscribed in their
   * 180×180 box; the right vertex is at the box's vertical centre, so
   * the same midpoint-based math works correctly for them.
   */
  function nodeDocsPosition(node, nodeEl) {
    const w = (nodeEl && nodeEl.offsetWidth)  || 220;
    const h = (nodeEl && nodeEl.offsetHeight) || 90;
    return {
      x: node.x + w + NODE_DOCS_GAP,
      y: node.y + h / 2,
      h, // node height — used to vertically centre the panel after it lays out
    };
  }

  function updateNodeDocsPosition(node) {
    const panel = nodeDocsEls.get(node.id);
    if (!panel) return;
    const nodeEl = nodeEls.get(node.id);
    const { x, y } = nodeDocsPosition(node, nodeEl);
    // translateY(-50%) vertically centres the panel against the node's
    // mid-line. translate3d for GPU-accelerated movement during drag.
    panel.style.transform = `translate3d(${x}px, ${y}px, 0) translateY(-50%)`;
  }

  /**
   * Re-render the panel for one node: visibility class, type accent,
   * content, and position. Idempotent — safe to call repeatedly from
   * any mutation site (inspector, drag, board switch).
   */
  function renderNodeDocs(node) {
    normalizeNodeDocuments(node);
    const docs = node.documents || [];
    const panel = ensureNodeDocs(node);

    // No documents → nothing to show. Hide the panel entirely (display
    // none keeps it out of the layout/paint pipeline).
    if (docs.length === 0) {
      panel.style.display = 'none';
      panel.classList.remove('is-pinned', 'is-preview', 'is-hovering');
      return;
    }

    panel.style.display = '';

    // Visibility mode: pinned (always visible) vs preview (visible on
    // node hover only). Hover state is applied via .is-hovering by the
    // node's pointerenter/leave handlers in attachNodeDocsHover.
    panel.classList.toggle('is-pinned',  !!node.showDocuments);
    panel.classList.toggle('is-preview', !node.showDocuments);

    // Variant accent — borrows the node's category colour.
    panel.classList.remove('node-docs--ai', 'node-docs--database');
    if (node.type === 'ai')              panel.classList.add('node-docs--ai');
    else if (node.shape === 'database')  panel.classList.add('node-docs--database');

    panel.innerHTML = `
      <div class="node-docs__title">Outputs</div>
      <ul class="node-docs__list">
        ${docs.map(d => `
          <li class="node-docs__item" title="${escapeHtml(d)}">
            <span class="node-docs__icon" aria-hidden="true"></span>
            <span class="node-docs__label">${escapeHtml(d)}</span>
          </li>`).join('')}
      </ul>
    `;

    updateNodeDocsPosition(node);
  }

  function removeNodeDocs(nodeId) {
    const panel = nodeDocsEls.get(nodeId);
    if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
    nodeDocsEls.delete(nodeId);
  }

  /**
   * Wire the node's hover state to the preview panel. We set a class on
   * the panel rather than using CSS sibling selectors because the node
   * and panel are independent DOM elements without a stable parent-child
   * or adjacent-sibling relationship in the layer.
   */
  function attachNodeDocsHover(nodeEl, node) {
    nodeEl.addEventListener('pointerenter', () => {
      const panel = nodeDocsEls.get(node.id);
      if (panel) panel.classList.add('is-hovering');
    });
    nodeEl.addEventListener('pointerleave', () => {
      const panel = nodeDocsEls.get(node.id);
      if (panel) panel.classList.remove('is-hovering');
    });
  }

  // ============================================================
  // EDGE RENDERING
  // (edge.type is now stored on the edge itself)
  // ============================================================
  function buildEdge(edge) {
    const g = document.createElementNS(NS, 'g');
    g.dataset.id = edge.id;
    const hit  = document.createElementNS(NS, 'path'); hit.setAttribute('class', 'edge__hit');
    const line = document.createElementNS(NS, 'path'); line.setAttribute('class', 'edge__line');
    // Shimmer overlay is rendered for every edge but only made visible
    // for AI edges via CSS. Keeping it in the DOM unconditionally lets
    // type toggles (manual ↔ AI) take effect via class change alone,
    // without needing to mutate the SVG structure.
    const shimmer = document.createElementNS(NS, 'path'); shimmer.setAttribute('class', 'edge__shimmer');
    // Waypoint handles live inside the edge group so they share the
    // edge's selection state via the .edge.is-selected ancestor.
    // Children are added/removed in renderEdgeWaypoints to match
    // edge.waypoints. Empty by default; CSS hides handles unless the
    // edge is selected.
    const wpGroup = document.createElementNS(NS, 'g'); wpGroup.setAttribute('class', 'edge__waypoints');
    g.appendChild(hit);
    g.appendChild(line);
    g.appendChild(shimmer);
    g.appendChild(wpGroup);

    g.addEventListener('click', (e) => { e.stopPropagation(); selectEdge(edge.id); });

    // Double-click on the edge inserts a waypoint at the click position.
    // Listening on the wide invisible hit path ensures it works anywhere
    // along the edge, not just exactly on the visible stroke.
    g.addEventListener('dblclick', (e) => {
      // Only act when the dblclick lands on the edge itself (not on a
      // waypoint handle, which has its own pointer handling).
      if (e.target.classList && e.target.classList.contains('edge__waypoint')) return;
      e.preventDefault();
      e.stopPropagation();
      const canvasRect = els.canvas.getBoundingClientRect();
      const px = e.clientX - canvasRect.left;
      const py = e.clientY - canvasRect.top;
      addWaypointAt(edge.id, px, py);
    });

    // Hover → show data-flow tooltip near the edge midpoint.
    // We listen on `pointerenter`/`pointerleave` (not `mouseover`/`mouseout`)
    // because the latter bubble on every child element transition and
    // would create flicker. The tooltip itself has pointer-events: none
    // so it never participates in hover hit-testing.
    g.addEventListener('pointerenter', () => showEdgeTooltip(edge.id));
    g.addEventListener('pointerleave', hideEdgeTooltip);

    return { g, hit, line, shimmer, wpGroup };
  }

  function refreshEdgeStyle(edge) {
    const refs = edgeEls.get(edge.id);
    if (!refs) return;
    const isSelected = edge.id === selectedEdgeId;
    const isBidir    = edge.direction === 'bidirectional';
    const isData     = edge.kind === 'data';
    refs.g.setAttribute(
      'class',
      `edge edge--${edge.type}` +
      (isBidir    ? ' edge--bidirectional' : '') +
      (isData     ? ' edge--data'          : '') +
      (isSelected ? ' is-selected'         : '')
    );

    // Marker logic:
    //   forward       → marker-end only (arrowhead at target)
    //   bidirectional → marker-start + marker-end (arrowheads at both ends)
    // We use a dedicated "Start" marker family rather than relying on
    // auto-start-reverse, because browsers handle refX inconsistently
    // for reflected markers, which caused the start arrowhead to render
    // in the wrong place (or appear missing) for some paths.
    const markerType = edge.type === 'ai'
      ? 'Ai'
      : edge.type === 'automated'
        ? 'Automated'
        : 'Manual';
    const selSuffix = isSelected ? 'Sel' : '';
    const endMarker   = `arrow${markerType}${selSuffix}`;
    const startMarker = `arrow${markerType}Start${selSuffix}`;

    refs.line.setAttribute('marker-end', `url(#${endMarker})`);
    if (edge.direction === 'bidirectional') {
      refs.line.setAttribute('marker-start', `url(#${startMarker})`);
    } else {
      // Always explicitly remove — never leave a stale marker-start behind
      // when toggling back from bidirectional → forward.
      refs.line.removeAttribute('marker-start');
    }
  }

  /**
   * Anchor system
   * -------------
   * Edges store sourceAnchor + targetAnchor as one of:
   *   "left" | "right" | "top" | "bottom" | "auto"
   *
   * "auto" means: pick the most natural side based on the relative
   * positions of the two nodes. resolveAutoAnchor does that selection.
   *
   * getNodeAnchorPoint(node, nodeEl, side) returns the {x, y} point on
   * the node's visible silhouette where an edge should attach.
   *
   * For a process node: the midpoint of the requested side of the
   * bounding box.
   * For a decision diamond (square footprint): the four vertices of the
   * diamond, which coincide with the midpoints of the bounding box
   * sides — so the math is identical to process.
   * For a database cylinder: left/right anchors are at the bounding
   * box midpoints; top/bottom anchors sit on the elliptical caps,
   * pulled inward a few px so the arrow visually touches the
   * curved silhouette rather than the rectangular bounding box.
   */
  const DB_TOP_INSET    = 6;   // distance from top of box to lid surface
  const DB_BOTTOM_INSET = 4;

  function getNodeAnchorPoint(node, nodeEl, side) {
    const w = nodeEl.offsetWidth  || 220;
    const h = nodeEl.offsetHeight || 90;
    const cx = node.x + w / 2;
    const cy = node.y + h / 2;
    const shape = node.shape || 'process';

    // Database top/bottom anchors hug the cylinder caps
    if (shape === 'database') {
      switch (side) {
        case 'right':  return { x: node.x + w,  y: cy };
        case 'left':   return { x: node.x,      y: cy };
        case 'top':    return { x: cx, y: node.y + DB_TOP_INSET };
        case 'bottom': return { x: cx, y: node.y + h - DB_BOTTOM_INSET };
      }
    }

    // Process + decision share the same simple anchors (decision
    // vertices = bounding box midpoints because of square footprint)
    switch (side) {
      case 'right':  return { x: node.x + w, y: cy };
      case 'left':   return { x: node.x,     y: cy };
      case 'top':    return { x: cx,         y: node.y };
      case 'bottom': return { x: cx,         y: node.y + h };
    }
    // Fallback (shouldn't happen)
    return { x: cx, y: cy };
  }

  /**
   * Auto-pick a (sourceSide, targetSide) pair given two nodes, choosing
   * the most natural exit/entry points. Heuristic:
   *   - If horizontal distance dominates, use right→left (or left→right).
   *   - Otherwise use top↔bottom.
   * The two sides face each other so the arrow flows cleanly.
   */
  function resolveAutoAnchor(fromNode, fromEl, toNode, toEl) {
    const fcx = fromNode.x + (fromEl.offsetWidth  || 220) / 2;
    const fcy = fromNode.y + (fromEl.offsetHeight || 90) / 2;
    const tcx = toNode.x   + (toEl.offsetWidth    || 220) / 2;
    const tcy = toNode.y   + (toEl.offsetHeight   || 90) / 2;
    const dx = tcx - fcx;
    const dy = tcy - fcy;

    if (Math.abs(dx) >= Math.abs(dy)) {
      // Horizontal dominant
      return dx >= 0
        ? { source: 'right',  target: 'left'  }
        : { source: 'left',   target: 'right' };
    } else {
      // Vertical dominant
      return dy >= 0
        ? { source: 'bottom', target: 'top'    }
        : { source: 'top',    target: 'bottom' };
    }
  }

  /**
   * Build a Bezier path between two anchor points. The control points
   * are biased along the axis perpendicular to each anchor's side, so
   * the curve leaves the source and enters the target along the
   * "natural" outward direction (e.g. a top anchor curves upward first).
   *
   * Used by both finished edges (computeEdgePath) and the live preview
   * (getPreviewPath).
   */
  /**
   * Build the SVG path string from source to target, optionally
   * routed through `waypoints` (purely visual control points — the
   * edge remains one logical connection).
   *
   * Without waypoints: classic single cubic Bezier — control points
   * pushed outward along the source/target side normals so the path
   * leaves/enters each node perpendicular to its anchor side.
   *
   * With waypoints: a chain of cubic segments through every point.
   * Tangents at interior waypoints follow Catmull-Rom-like smoothing
   * so joins stay C1-continuous (no kinks).
   *
   * Per-point tangent semantics
   * ---------------------------
   * For each point Pi we define a single unit vector Ti that gives
   * "the direction the path is heading as it passes through Pi".
   *
   *   T_source = outward normal of source side
   *              (so path LEAVES source heading outward)
   *   T_target = INWARD direction of target side
   *              = - outward normal of target side
   *              (so path ARRIVES at target heading inward → arrowhead
   *               orient="auto" rotates the marker to point INTO target)
   *   T_interior = unit vector of (next - prev) / 2
   *
   * Control-point construction for segment i (from Pi to P_{i+1}):
   *   c1 = Pi   + Ti       * reach     (leaves Pi forward along Ti)
   *   c2 = P_{i+1} - T_{i+1} * reach   (arrives at P_{i+1} along T_{i+1};
   *                                     c2 sits BEFORE P_{i+1} along that
   *                                     direction, so we subtract)
   *
   * For the no-waypoints case this collapses exactly to:
   *   c1 = source + outward_source * reach
   *   c2 = target - inward_target  * reach
   *      = target + outward_target * reach
   * which matches the prior behavior — the path leaves source outward
   * and the c2 sits OUTSIDE the target (correct for arrowhead direction).
   */
  function getPreviewPath(a, b, sourceSide, targetSide, waypoints) {
    const wps = Array.isArray(waypoints) ? waypoints : [];

    function outwardNormal(side) {
      switch (side) {
        case 'right':  return { x:  1, y:  0 };
        case 'left':   return { x: -1, y:  0 };
        case 'top':    return { x:  0, y: -1 };
        case 'bottom': return { x:  0, y:  1 };
        default:       return { x:  1, y:  0 };
      }
    }

    // Build the full point list: [source, ...waypoints, target]
    const points = [a, ...wps, b];

    // Compute the heading tangent at each point.
    // T[0] = outward source normal
    // T[last] = inward target = -outward target
    // T[i] interior = unit (next - prev)
    const T = new Array(points.length);
    for (let i = 0; i < points.length; i++) {
      if (i === 0) {
        T[i] = outwardNormal(sourceSide);
      } else if (i === points.length - 1) {
        const o = outwardNormal(targetSide);
        T[i] = { x: -o.x, y: -o.y }; // inward = -outward
      } else {
        const prev = points[i - 1];
        const next = points[i + 1];
        const dx = next.x - prev.x;
        const dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        T[i] = { x: dx / len, y: dy / len };
      }
    }

    // Build the path: M source, then one cubic per segment.
    let d = `M ${points[0].x} ${points[0].y}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i];
      const p1 = points[i + 1];
      const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      // Per-segment reach: half the segment length, clamped to a
      // minimum so very short segments still curve gracefully.
      const reach = Math.max(40, segLen * 0.4);

      const c1 = { x: p0.x + T[i].x     * reach, y: p0.y + T[i].y     * reach };
      const c2 = { x: p1.x - T[i + 1].x * reach, y: p1.y - T[i + 1].y * reach };
      d += ` C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p1.x} ${p1.y}`;
    }
    return d;
  }

  function computeEdgePath(edge) {
    const board = activeBoard();
    const from = board.data.nodes.find(n => n.id === edge.from);
    const to   = board.data.nodes.find(n => n.id === edge.to);
    if (!from || !to) return null;

    const fromEl = nodeEls.get(from.id);
    const toEl   = nodeEls.get(to.id);
    if (!fromEl || !toEl) return null;

    // Resolve "auto" anchors based on current node positions
    const sourceSide = (edge.sourceAnchor && edge.sourceAnchor !== 'auto')
      ? edge.sourceAnchor : null;
    const targetSide = (edge.targetAnchor && edge.targetAnchor !== 'auto')
      ? edge.targetAnchor : null;

    let s = sourceSide, t = targetSide;
    if (!s || !t) {
      const auto = resolveAutoAnchor(from, fromEl, to, toEl);
      if (!s) s = auto.source;
      if (!t) t = auto.target;
    }

    // Logical anchor points sit exactly on the node border. The SVG layer
    // is painted UNDERNEATH the node DOM layer, so a marker rendered
    // exactly at the border ends up partially or fully hidden by the node.
    // We push the rendered endpoints a few pixels outward along the
    // anchor's outward-normal so the arrowhead stays visible.
    const a = getRenderedEdgeEndpoints({ node: from, el: fromEl, side: s, isSource: true  });
    const b = getRenderedEdgeEndpoints({ node: to,   el: toEl,   side: t, isSource: false });
    return getPreviewPath(a, b, s, t, edge.waypoints);
  }

  /**
   * ARROWHEAD VISIBILITY OFFSET
   * ---------------------------
   * The DOM stacking order in this app is:
   *   SVG edges layer  (painted first, sits underneath)
   *   nodes layer      (painted on top)
   * That means an arrowhead drawn exactly at a node's border is hidden
   * by the node DOM. To keep arrowheads visible without changing the
   * logical anchor model (used for inspector display, hit-testing, etc.),
   * we offset only the RENDERED path endpoints outward along the anchor
   * side normal. The arrow tip then sits in the gap between the node and
   * the marker, fully visible.
   *
   * The chosen offset (10px) is large enough to clear the marker's
   * 6×6 (or 7×7 selected) bounding box plus a small visual gap, while
   * staying tight enough that the arrow still reads as "attached" to
   * the node.
   */
  const ARROW_OFFSET = 10;

  function offsetPointFromNode(point, side, amount) {
    switch (side) {
      case 'right':  return { x: point.x + amount, y: point.y };
      case 'left':   return { x: point.x - amount, y: point.y };
      case 'top':    return { x: point.x,          y: point.y - amount };
      case 'bottom': return { x: point.x,          y: point.y + amount };
      default:       return { x: point.x,          y: point.y };
    }
  }

  /**
   * Returns the *rendered* endpoint for one side of an edge, offset
   * outward from the node so the marker is painted in clear space.
   * Accepts an options object so it reads naturally at the call site.
   */
  function getRenderedEdgeEndpoints({ node, el, side }) {
    const anchor = getNodeAnchorPoint(node, el, side);
    return offsetPointFromNode(anchor, side, ARROW_OFFSET);
  }

  // Backwards-compat shims kept so older code that referenced these
  // names still works. They resolve to the right-side / left-side anchor.
  function nodeAnchorOut(node, el) { return getNodeAnchorPoint(node, el, 'right'); }
  function nodeAnchorIn(node, el)  { return getNodeAnchorPoint(node, el, 'left'); }

  // ============================================================
  // EDGE LABELS
  // ------------------------------------------------------------
  // One <div class="edge-label"> per edge that has a non-empty label.
  // Stored in edgeLabelEls keyed by edge id. Sibling of canvas (lives
  // in the canvas overlay layer alongside other floating UI) so its
  // position is just `transform: translate(x, y)` in canvas-relative
  // pixels.
  // ============================================================
  const edgeLabelEls = new Map();

  function ensureEdgeLabel(edge) {
    let el = edgeLabelEls.get(edge.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'edge-label';
      el.dataset.edgeId = edge.id;
      els.canvas.appendChild(el);
      edgeLabelEls.set(edge.id, el);
    }
    return el;
  }

  function removeEdgeLabel(edgeId) {
    const el = edgeLabelEls.get(edgeId);
    if (el && el.parentNode) el.parentNode.removeChild(el);
    edgeLabelEls.delete(edgeId);
  }

  /**
   * Position fraction along the path where the label is rendered.
   * 0 = at source, 1 = at target. Decision-source edges feel more
   * natural with the label closer to the source ("YES" sits just past
   * the diamond rather than mid-arrow).
   */
  function edgeLabelFraction(edge) {
    const board = activeBoard();
    const from = board.data.nodes.find(n => n.id === edge.from);
    if (from && from.shape === 'decision') return 0.35;
    return 0.5;
  }

  function renderEdgeLabel(edge) {
    const text = (edge.label || '').trim();
    if (!text) {
      // Edge has no label — make sure no stale element lingers.
      removeEdgeLabel(edge.id);
      return;
    }
    const refs = edgeEls.get(edge.id);
    if (!refs || !refs.line) return;
    const el = ensureEdgeLabel(edge);
    el.textContent = text;
    el.classList.toggle('is-ai', edge.type === 'ai');
    el.classList.toggle('is-automated', edge.type === 'automated');

    // Position via getPointAtLength on the actual rendered path —
    // accurate for any geometry, including curves and waypoint chains.
    try {
      const len = refs.line.getTotalLength();
      if (!len) return;
      const p = refs.line.getPointAtLength(len * edgeLabelFraction(edge));
      // translate(-50%, -50%) centres the pill on the path point.
      el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -50%)`;
    } catch {
      // getPointAtLength can throw on detached/invalid paths — silently
      // skip; the label will reposition on the next updateEdgePath.
    }
  }

  // ============================================================
  // WAYPOINTS
  // ------------------------------------------------------------
  // Waypoints are PURELY VISUAL routing controls. The edge stays a
  // single logical connection regardless of how many waypoints it has.
  // Handles are rendered as SVG <circle> children of the edge group
  // and become interactive only when the edge is selected (CSS rule).
  // ============================================================

  // Tracks which waypoint (by edge id + index) is currently selected
  // so Delete/Backspace can remove the right one.
  let selectedWaypoint = null; // { edgeId, index } | null

  function clearWaypointSelection() {
    if (!selectedWaypoint) return;
    const refs = edgeEls.get(selectedWaypoint.edgeId);
    if (refs && refs.wpGroup) {
      const handles = refs.wpGroup.querySelectorAll('.edge__waypoint');
      handles.forEach(h => h.classList.remove('is-selected'));
    }
    selectedWaypoint = null;
  }

  function renderEdgeWaypoints(edge) {
    const refs = edgeEls.get(edge.id);
    if (!refs || !refs.wpGroup) return;
    const wps = Array.isArray(edge.waypoints) ? edge.waypoints : [];

    // Cheap diff: rebuild handles when count changes; otherwise just
    // reposition. Since waypoint counts change rarely (only on add /
    // delete), the rebuild path is fine.
    const existing = refs.wpGroup.querySelectorAll('.edge__waypoint');
    if (existing.length !== wps.length) {
      refs.wpGroup.innerHTML = '';
      wps.forEach((p, idx) => {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('class', 'edge__waypoint');
        c.setAttribute('r', '5');
        c.dataset.edgeId = edge.id;
        c.dataset.idx = String(idx);
        attachWaypointDrag(c, edge.id, idx);
        refs.wpGroup.appendChild(c);
      });
    }
    // Position each handle.
    const handles = refs.wpGroup.querySelectorAll('.edge__waypoint');
    handles.forEach((h, i) => {
      const p = wps[i];
      h.setAttribute('cx', p.x);
      h.setAttribute('cy', p.y);
      // Restore selected highlight if this is the selected waypoint.
      if (selectedWaypoint && selectedWaypoint.edgeId === edge.id && selectedWaypoint.index === i) {
        h.classList.add('is-selected');
      } else {
        h.classList.remove('is-selected');
      }
    });
  }

  function attachWaypointDrag(handle, edgeId, idx) {
    // Don't let the click bubble to the edge group — the edge is
    // already selected (handles only render when selected), and the
    // bubble would re-fire the edge's click selector for no benefit.
    handle.addEventListener('click', (e) => e.stopPropagation());
    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();

      const board = activeBoard();
      const edge = board.data.edges.find(x => x.id === edgeId);
      if (!edge) return;
      const wp = edge.waypoints && edge.waypoints[idx];
      if (!wp) return;

      // Select this waypoint so the Delete/Backspace key target is clear.
      clearWaypointSelection();
      selectedWaypoint = { edgeId, index: idx };
      handle.classList.add('is-selected', 'is-dragging');

      // Snapshot history before any drag movement; discarded on pointerup
      // if no movement actually happened.
      pushUndoSnapshot('waypoint-drag');

      const canvasRect = els.canvas.getBoundingClientRect();
      const startX = e.clientX - canvasRect.left;
      const startY = e.clientY - canvasRect.top;
      const offsetX = startX - wp.x;
      const offsetY = startY - wp.y;
      let moved = false;

      handle.setPointerCapture(e.pointerId);

      function onMove(ev) {
        const px = ev.clientX - canvasRect.left;
        const py = ev.clientY - canvasRect.top;
        const newX = px - offsetX;
        const newY = py - offsetY;
        if (!moved && (Math.abs(newX - wp.x) > 1 || Math.abs(newY - wp.y) > 1)) moved = true;
        wp.x = newX;
        wp.y = newY;
        updateEdgePath(edge);
      }
      function onUp(ev) {
        try { handle.releasePointerCapture(ev.pointerId); } catch {}
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        handle.classList.remove('is-dragging');
        if (moved) {
          touchBoard();
          scheduleSave('waypoint-drag');
        } else {
          discardLastSnapshot();
        }
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
  }

  /**
   * Insert a new waypoint at canvas-relative (px, py). The waypoint is
   * inserted between the two existing path points whose midpoint is
   * closest to the click — keeps the path order coherent with the
   * user's intent.
   */
  function addWaypointAt(edgeId, px, py) {
    const board = activeBoard();
    const edge = board.data.edges.find(x => x.id === edgeId);
    if (!edge) return;

    pushUndoSnapshot('waypoint-add');

    if (!Array.isArray(edge.waypoints)) edge.waypoints = [];

    // Find the best insertion index. We need source/target endpoint
    // coordinates to evaluate segment midpoints. Reuse computeEdgePath's
    // anchor resolution by directly building the points list.
    const from = board.data.nodes.find(n => n.id === edge.from);
    const to   = board.data.nodes.find(n => n.id === edge.to);
    if (!from || !to) { discardLastSnapshot(); return; }
    const fromEl = nodeEls.get(from.id);
    const toEl   = nodeEls.get(to.id);
    if (!fromEl || !toEl) { discardLastSnapshot(); return; }

    let s = (edge.sourceAnchor && edge.sourceAnchor !== 'auto') ? edge.sourceAnchor : null;
    let t = (edge.targetAnchor && edge.targetAnchor !== 'auto') ? edge.targetAnchor : null;
    if (!s || !t) {
      const auto = resolveAutoAnchor(from, fromEl, to, toEl);
      if (!s) s = auto.source;
      if (!t) t = auto.target;
    }
    const a = getRenderedEdgeEndpoints({ node: from, el: fromEl, side: s });
    const b = getRenderedEdgeEndpoints({ node: to,   el: toEl,   side: t });
    const points = [a, ...edge.waypoints, b];

    let bestIdx = 0;
    let bestDist = Infinity;
    for (let i = 0; i < points.length - 1; i++) {
      const mx = (points[i].x + points[i + 1].x) / 2;
      const my = (points[i].y + points[i + 1].y) / 2;
      const d = Math.hypot(px - mx, py - my);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    // Insert at bestIdx (between points[bestIdx] and points[bestIdx+1])
    // → in the waypoints array, that's index bestIdx (since the source
    // is at index 0 in `points` but waypoints start at index 0 in the
    // waypoints array).
    edge.waypoints.splice(bestIdx, 0, { x: px, y: py });

    // Select the newly inserted waypoint so Delete works on it.
    clearWaypointSelection();
    selectedWaypoint = { edgeId, index: bestIdx };

    // Make sure this edge is the selected edge so the handles are visible.
    if (selectedEdgeId !== edgeId) selectEdge(edgeId);

    updateEdgePath(edge);
    touchBoard();
    scheduleSave('waypoint-add');
  }

  function removeSelectedWaypoint() {
    if (!selectedWaypoint) return false;
    const board = activeBoard();
    const edge = board.data.edges.find(x => x.id === selectedWaypoint.edgeId);
    if (!edge || !Array.isArray(edge.waypoints)) { selectedWaypoint = null; return false; }

    pushUndoSnapshot('waypoint-delete');
    edge.waypoints.splice(selectedWaypoint.index, 1);
    selectedWaypoint = null;
    updateEdgePath(edge);
    touchBoard();
    scheduleSave('waypoint-delete');
    return true;
  }

  // Delete / Backspace removes the currently selected waypoint, but
  // never when an editable field has focus (native delete should win).
  document.addEventListener('keydown', (e) => {
    if (isEditableTarget(e.target)) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedWaypoint) {
      e.preventDefault();
      removeSelectedWaypoint();
    }
  });

  function updateEdgePath(edge) {
    const refs = edgeEls.get(edge.id);
    if (!refs) return;
    const d = computeEdgePath(edge);
    if (!d) return;
    refs.hit.setAttribute('d', d);
    refs.line.setAttribute('d', d);
    if (refs.shimmer) refs.shimmer.setAttribute('d', d);
    // Label and waypoint handles follow the path geometry — keep them
    // in sync with every path update (drag, anchor change, etc.).
    renderEdgeLabel(edge);
    renderEdgeWaypoints(edge);
  }

  function renderAllEdges() {
    // Hide any open tooltip — the underlying edge DOM is about to be
    // destroyed and no pointerleave will fire on a removed element.
    hideEdgeTooltip();
    // Clear all label DOM and any waypoint selection — the source DOM
    // (edge groups + label elements) is about to be wiped.
    edgeLabelEls.forEach(el => { if (el.parentNode) el.parentNode.removeChild(el); });
    edgeLabelEls.clear();
    clearWaypointSelection();
    els.edgesGroup.innerHTML = '';
    edgeEls.clear();
    const board = activeBoard();
    board.data.edges.forEach(edge => {
      const refs = buildEdge(edge);
      els.edgesGroup.appendChild(refs.g);
      edgeEls.set(edge.id, refs);
      refreshEdgeStyle(edge);
      updateEdgePath(edge);
    });
  }

  function updateEdgesForNode(nodeId) {
    activeBoard().data.edges.forEach(edge => {
      if (edge.from === nodeId || edge.to === nodeId) updateEdgePath(edge);
    });
  }

  // ============================================================
  // HORIZONTAL ALIGNMENT SNAP
  // ------------------------------------------------------------
  // While dragging a node, compare its vertical center against every
  // other node's vertical center. If the distance is within
  // SNAP_Y_THRESHOLD pixels, snap the dragged node so the centers
  // coincide and show a thin guide line at that y. The guide hides
  // automatically when no snap is active or the drag ends.
  //
  // Center-based comparison handles process/decision/database nodes
  // uniformly even though they have different heights.
  // ============================================================
  const SNAP_Y_THRESHOLD = 8;

  function getNodeCenterY(node, nodeEl) {
    const h = (nodeEl && nodeEl.offsetHeight) || 90;
    return node.y + h / 2;
  }

  /**
   * Find the nearest node whose vertical center is within SNAP_Y_THRESHOLD
   * of the dragged node's center. Returns { y, delta } for the guide /
   * snap target, or null if nothing qualifies.
   */
  function findHorizontalSnap(draggedNode) {
    const draggedEl = nodeEls.get(draggedNode.id);
    const draggedHeight = (draggedEl && draggedEl.offsetHeight) || 90;
    const draggedCenterY = draggedNode.y + draggedHeight / 2;
    let best = null;
    activeBoard().data.nodes.forEach(other => {
      if (other.id === draggedNode.id) return;
      const otherEl = nodeEls.get(other.id);
      if (!otherEl) return;
      const otherCenterY = other.y + (otherEl.offsetHeight || 90) / 2;
      const delta = Math.abs(draggedCenterY - otherCenterY);
      if (delta <= SNAP_Y_THRESHOLD && (!best || delta < best.delta)) {
        best = { y: otherCenterY, delta };
      }
    });
    return best;
  }

  function showHorizontalGuide(y) {
    const g = els.horizontalGuide;
    if (!g) return;
    g.style.top = y + 'px';
    g.classList.add('is-visible');
  }

  function hideHorizontalGuide() {
    if (els.horizontalGuide) els.horizontalGuide.classList.remove('is-visible');
  }

  // ============================================================
  // DRAG & DROP
  // ============================================================
  function attachDragging(el, node) {
    const handle = el.querySelector('.node__drag');
    if (!handle) return;

    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('[contenteditable="true"]')) return;
      if (e.target.closest('[data-action="toggle-ai"]')) return;
      if (e.target.closest('[data-action="start-connection"]')) return;
      if (e.button !== 0) return;
      e.preventDefault();

      // Capture the pre-drag state ONCE here, not per pointermove. If
      // the drag ultimately produces no movement (a click that didn't
      // travel beyond the 2px threshold) we'll pop this snapshot back
      // off in onUp so we don't pollute history with no-ops.
      pushUndoSnapshot('drag');

      const canvasRect = els.canvas.getBoundingClientRect();
      const startX = e.clientX - canvasRect.left;
      const startY = e.clientY - canvasRect.top;
      const offsetX = startX - node.x;
      const offsetY = startY - node.y;
      let moved = false;

      el.classList.add('is-dragging');
      els.canvas.classList.add('is-dragging');
      handle.setPointerCapture(e.pointerId);

      function onMove(ev) {
        const px = ev.clientX - canvasRect.left;
        const py = ev.clientY - canvasRect.top;
        node.x = Math.max(-40, Math.min(canvasRect.width  - 60, px - offsetX));
        node.y = Math.max(-10, Math.min(canvasRect.height - 60, py - offsetY));

        // Horizontal snap: if the dragged node's vertical center is
        // close to another node's, lock onto that center and show a
        // guide line. We MUST adjust node.y here (before
        // setNodePosition) so the rendered position and the snap match.
        // The snap math reads the dragged node's own offsetHeight via
        // findHorizontalSnap, so it's correct for any shape.
        const snap = findHorizontalSnap(node);
        if (snap) {
          const draggedHeight = (el.offsetHeight) || 90;
          node.y = snap.y - draggedHeight / 2;
          showHorizontalGuide(snap.y);
        } else {
          hideHorizontalGuide();
        }

        setNodePosition(node);
        updateEdgesForNode(node.id);
        if (!moved && (Math.abs(px - startX) > 2 || Math.abs(py - startY) > 2)) moved = true;
      }
      function onUp(ev) {
        handle.releasePointerCapture(ev.pointerId);
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        el.classList.remove('is-dragging');
        els.canvas.classList.remove('is-dragging');
        // Always hide the guide on drag end — even if the pointer
        // released exactly while snapped, the guide is a transient
        // affordance, not a persistent canvas decoration.
        hideHorizontalGuide();
        if (moved) {
          touchBoard();
          scheduleSave('drag');
        } else {
          // Nothing moved — pop the snapshot we pushed at pointerdown
          // so the undo stack only reflects real movements.
          discardLastSnapshot();
        }
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
  }

  // ============================================================
  // EDITING
  // ============================================================
  function attachEditing(el, node) {
    el.querySelectorAll('[contenteditable="true"]').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        e.stopPropagation();
      });
      // Stop click bubbling so editing a field doesn't also trigger node-selection.
      input.addEventListener('click', (e) => e.stopPropagation());
      // Capture the pre-edit state ONCE per editing session, on focus.
      // If the user blurs without changing anything, we discard. This
      // gives one history entry per "started editing → done editing"
      // gesture, regardless of how many keystrokes happened.
      input.addEventListener('focus', () => {
        pushUndoSnapshot('edit-' + (input.dataset.field || 'inline'));
      });
      input.addEventListener('blur', () => {
        const field = input.dataset.field;
        const val = input.textContent.replace(/\s+/g, ' ').trim() || '—';
        input.textContent = val;
        if (node[field] !== val) {
          node[field] = val;
          touchBoard();
          // If this node is selected in the inspector, sync its form fields.
          if (selectedKind === 'node' && selectedNodeId === node.id) {
            const formField = els.inspectorContent.querySelector(`[data-field="${field}"]`);
            if (formField && formField.value !== val) formField.value = val;
          }
          // If a connected edge is selected, the route names need to refresh.
          if (selectedKind === 'edge' && selectedEdgeId) {
            const edge = activeBoard().data.edges.find(e => e.id === selectedEdgeId);
            if (edge && (edge.from === node.id || edge.to === node.id)) renderInspector();
          }
          renderBoardList();
          scheduleSave('edit');
        } else {
          // Field unchanged — drop the focus-time snapshot.
          discardLastSnapshot();
        }
      });
      input.addEventListener('pointerdown', (e) => e.stopPropagation());
    });
  }

  // ============================================================
  // NODE AI TOGGLE
  // ============================================================
  function attachToggle(el, node) {
    const btn = el.querySelector('[data-action="toggle-ai"]');
    if (!btn) return;
    btn.addEventListener('pointerdown', (e) => e.stopPropagation());
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      pushUndoSnapshot('toggle-node');
      node.type = node.type === 'ai' ? 'manual' : 'ai';
      refreshNodeClass(node);
      // Panel accent follows the node's type — re-render for the colour swap.
      renderNodeDocs(node);
      touchBoard();
      renderBoardList();
      // If this node is currently selected in the inspector, refresh it
      // so the Type segmented control stays in sync.
      if (selectedKind === 'node' && selectedNodeId === node.id) renderNodeInspector();
      showToast(`${node.title} → ${node.type === 'ai' ? 'AI mode' : 'manual mode'}`);
      scheduleSave('toggle-node');
    });
  }

  // ============================================================
  // SELECTION + INSPECTOR
  //
  // Single source of truth: selectedKind + (selectedNodeId | selectedEdgeId).
  // Helper functions:
  //   selectNode(id)       — selects a node, clears any edge selection
  //   selectEdge(id)       — selects an edge, clears any node selection
  //   clearSelection()     — clears both, returns inspector to empty state
  //   renderInspector()    — routes to the right view based on selectedKind
  // ============================================================

  function attachNodeSelection(el, node) {
    // Single click on the node body selects it. We intentionally use 'click'
    // (not 'pointerdown') so a real drag never triggers selection — drags
    // never finish with a click event because of pointer capture handoff.
    el.addEventListener('click', (e) => {
      // Don't hijack clicks landing on text fields, the toggle, or the connection handle.
      if (e.target.closest('[contenteditable="true"]')) return;
      if (e.target.closest('[data-action="toggle-ai"]')) return;
      if (e.target.closest('[data-action="start-connection"]')) return;
      e.stopPropagation();
      selectNode(node.id);
    });
  }

  // ============================================================
  // CONNECTION DRAG — drawing a new edge from a node's right-side handle.
  //
  // State: pendingConnection = { fromNodeId, pointerId, pathEl, hoverTargetId }
  // Lifecycle:
  //   pointerdown on .node__conn   → startConnectionDrag(node, event)
  //   pointermove (captured)       → updateConnectionPreview(event)
  //   pointerup   (captured)       → finishConnectionDrag(event)
  //   pointercancel                → cancelConnectionDrag()
  //
  // The preview SVG path lives in a dedicated <g> in the edges layer so it
  // shares coordinate space with real edges. pointer-events: none on the
  // preview path keeps elementFromPoint lookups working.
  // ============================================================
  let pendingConnection = null;

  function attachConnectionHandle(el, node) {
    // Wire every side handle. The side is read from data-side at drag start.
    el.querySelectorAll('[data-action="start-connection"]').forEach(knob => {
      knob.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        const side = knob.dataset.side || 'right';
        startConnectionDrag(node, e, knob, side);
      });
    });
  }

  function startConnectionDrag(node, event, knob, sourceSide) {
    if (pendingConnection) cancelConnectionDrag();

    const NS = 'http://www.w3.org/2000/svg';
    const pathEl = document.createElementNS(NS, 'path');
    pathEl.setAttribute('class', 'edge-preview');
    els.edgesGroup.appendChild(pathEl);

    pendingConnection = {
      fromNodeId: node.id,
      pointerId: event.pointerId,
      pathEl,
      hoverTargetId: null,
      hoverTargetSide: null,
      sourceSide,
      knob,
    };

    // Mark the source node + active source handle visually
    const srcEl = nodeEls.get(node.id);
    if (srcEl) srcEl.classList.add('node--connecting');
    knob.dataset.active = 'true';

    knob.setPointerCapture(event.pointerId);
    knob.addEventListener('pointermove', _onConnectionMove);
    knob.addEventListener('pointerup',   _onConnectionUp);
    knob.addEventListener('pointercancel', _onConnectionCancel);

    updateConnectionPreview(event);
  }

  function _onConnectionMove(ev) {
    if (!pendingConnection || ev.pointerId !== pendingConnection.pointerId) return;
    updateConnectionPreview(ev);
  }
  function _onConnectionUp(ev) {
    if (!pendingConnection || ev.pointerId !== pendingConnection.pointerId) return;
    finishConnectionDrag(ev);
  }
  function _onConnectionCancel(ev) {
    if (!pendingConnection || ev.pointerId !== pendingConnection.pointerId) return;
    cancelConnectionDrag();
  }

  function updateConnectionPreview(event) {
    if (!pendingConnection) return;
    const board = activeBoard();
    const fromNode = board.data.nodes.find(n => n.id === pendingConnection.fromNodeId);
    const fromEl   = nodeEls.get(pendingConnection.fromNodeId);
    if (!fromNode || !fromEl) return;

    const canvasRect = els.canvas.getBoundingClientRect();
    const px = event.clientX - canvasRect.left;
    const py = event.clientY - canvasRect.top;

    // Hit-test for a valid drop target. Prefer a connection handle if the
    // cursor is over one — that gives the user explicit control over the
    // target side. Otherwise fall back to the node body, which means
    // we'll auto-resolve the target side at drop time.
    let targetId   = null;
    let targetSide = null;
    const overEl = document.elementFromPoint(event.clientX, event.clientY);
    if (overEl) {
      const knob = overEl.closest('.node__conn');
      if (knob) {
        const nodeEl = knob.closest('.node');
        if (nodeEl) {
          const id = nodeEl.dataset.id;
          if (id && id !== pendingConnection.fromNodeId &&
              board.data.nodes.some(n => n.id === id)) {
            targetId   = id;
            targetSide = knob.dataset.side || null;
          }
        }
      } else {
        const nodeEl = overEl.closest('.node');
        if (nodeEl) {
          const id = nodeEl.dataset.id;
          if (id && id !== pendingConnection.fromNodeId &&
              board.data.nodes.some(n => n.id === id)) {
            targetId = id;
          }
        }
      }
    }

    // Update drop-target highlight if it changed
    if (targetId !== pendingConnection.hoverTargetId) {
      if (pendingConnection.hoverTargetId) {
        const prev = nodeEls.get(pendingConnection.hoverTargetId);
        if (prev) prev.classList.remove('is-drop-target');
      }
      if (targetId) {
        const next = nodeEls.get(targetId);
        if (next) next.classList.add('is-drop-target');
      }
      pendingConnection.hoverTargetId = targetId;
    }
    pendingConnection.hoverTargetSide = targetSide;

    // Build preview path. Source side is fixed (came from the handle the
    // user grabbed). Target side is either the handle they're hovering or,
    // if they're on the body, auto-resolved from relative position.
    // We use the same outward offset as finished edges so the preview's
    // start point sits in the visible gap beside the source node, matching
    // exactly where the rendered edge will land on drop.
    const sSide = pendingConnection.sourceSide;
    const a = getRenderedEdgeEndpoints({ node: fromNode, el: fromEl, side: sSide, isSource: true });

    let b, tSide;
    if (targetId) {
      const toNode = board.data.nodes.find(n => n.id === targetId);
      const toEl   = nodeEls.get(targetId);
      if (targetSide) {
        tSide = targetSide;
      } else {
        const auto = resolveAutoAnchor(fromNode, fromEl, toNode, toEl);
        tSide = auto.target;
      }
      b = getRenderedEdgeEndpoints({ node: toNode, el: toEl, side: tSide, isSource: false });
    } else {
      // Free-floating preview tip — pick a target side based on which
      // direction the cursor is from the source anchor.
      b = { x: px, y: py };
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      tSide = (Math.abs(dx) >= Math.abs(dy))
        ? (dx >= 0 ? 'left' : 'right')
        : (dy >= 0 ? 'top'  : 'bottom');
    }

    pendingConnection.pathEl.setAttribute('d', getPreviewPath(a, b, sSide, tSide));
  }

  function finishConnectionDrag(event) {
    if (!pendingConnection) return;
    const targetId   = pendingConnection.hoverTargetId;
    const targetSide = pendingConnection.hoverTargetSide; // may be null → auto
    const sourceSide = pendingConnection.sourceSide;
    const fromId     = pendingConnection.fromNodeId;
    _teardownConnectionDrag();

    if (!targetId) return;                  // dropped on empty space
    if (targetId === fromId) return;        // self-connection guard
    if (hasEdge(fromId, targetId)) {
      showToast('Connection already exists');
      return;
    }
    const newId = createEdge(fromId, targetId, {
      sourceAnchor: sourceSide || 'auto',
      targetAnchor: targetSide || 'auto',
    });
    if (newId) {
      showToast('Connection created');
      selectEdge(newId);
      scheduleSave('create-edge');
    }
  }

  function cancelConnectionDrag() {
    if (!pendingConnection) return;
    _teardownConnectionDrag();
  }

  function _teardownConnectionDrag() {
    const pc = pendingConnection;
    pendingConnection = null;
    if (!pc) return;
    if (pc.pathEl && pc.pathEl.parentNode) pc.pathEl.parentNode.removeChild(pc.pathEl);
    if (pc.hoverTargetId) {
      const el = nodeEls.get(pc.hoverTargetId);
      if (el) el.classList.remove('is-drop-target');
    }
    const srcEl = nodeEls.get(pc.fromNodeId);
    if (srcEl) srcEl.classList.remove('node--connecting');
    if (pc.knob) {
      delete pc.knob.dataset.active;
      try { pc.knob.releasePointerCapture(pc.pointerId); } catch {}
      pc.knob.removeEventListener('pointermove', _onConnectionMove);
      pc.knob.removeEventListener('pointerup',   _onConnectionUp);
      pc.knob.removeEventListener('pointercancel', _onConnectionCancel);
    }
  }

  // Escape key cancels a pending connection drag
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && pendingConnection) cancelConnectionDrag();
  });

  // ============================================================
  // EDGE DATA-FLOW TOOLTIP
  // ============================================================

  /**
   * Parse the inspector's textarea into a clean string[] of data items.
   * One non-empty line = one item. Whitespace trimmed; empty lines skipped.
   */
  function parseEdgeDataItems(text) {
    if (typeof text !== 'string') return [];
    return text.split('\n').map(s => s.trim()).filter(Boolean);
  }

  /**
   * Returns the midpoint of an SVG <path> in user-space coordinates,
   * using the path's intrinsic length parametrisation. This handles
   * curved Beziers correctly — straight midpoint of the bounding box
   * would land in the wrong place for S-shaped routes.
   */
  function getEdgeMidpoint(pathEl) {
    if (!pathEl) return null;
    try {
      const len = pathEl.getTotalLength();
      if (!len) return null;
      const p = pathEl.getPointAtLength(len / 2);
      return { x: p.x, y: p.y };
    } catch {
      return null;
    }
  }

  function hideEdgeTooltip() {
    if (!els.edgeTooltip) return;
    els.edgeTooltip.classList.remove('is-visible');
    // Hide after the fade so it doesn't intercept hit-testing during
    // the tail of the transition.
    setTimeout(() => {
      if (!els.edgeTooltip.classList.contains('is-visible')) {
        els.edgeTooltip.hidden = true;
      }
    }, 160);
  }

  /**
   * Show the data-flow tooltip for the given edge id, anchored at the
   * edge's visual midpoint (slightly offset above so it doesn't sit
   * directly on the line). If the edge has no dataItems we keep the
   * tooltip hidden — the cleaner option from the spec.
   */
  function showEdgeTooltip(edgeId) {
    const board = activeBoard();
    const edge = board.data.edges.find(e => e.id === edgeId);
    if (!edge) return;
    const items = Array.isArray(edge.dataItems) ? edge.dataItems : [];
    if (items.length === 0) {
      hideEdgeTooltip();
      return;
    }

    const refs = edgeEls.get(edge.id);
    if (!refs) return;

    const from = board.data.nodes.find(n => n.id === edge.from);
    const to   = board.data.nodes.find(n => n.id === edge.to);
    const isAi = edge.type === 'ai';
    const isAutomated = edge.type === 'automated';
    const isBidir = edge.direction === 'bidirectional';
    const isData  = edge.kind === 'data';

    const tip = els.edgeTooltip;
    tip.className = 'edge-tooltip' + (isAi ? ' is-ai' : '') + (isAutomated ? ' is-automated' : '');
    // Title swaps to reflect the connection kind. Subtle change — same
    // visual treatment, just sharper labeling so the user always knows
    // what they're looking at.
    const tooltipTitle = isData ? 'Data Transfer' : 'Data Flow';
    tip.innerHTML = `
      <div class="edge-tooltip__title">${tooltipTitle}</div>
      <div class="edge-tooltip__route">
        <span class="from">${escapeHtml(from?.title || '—')}</span>
        <span class="arrow">${isBidir ? '↔' : '→'}</span>
        <span class="to">${escapeHtml(to?.title || '—')}</span>
      </div>
      <ul class="edge-tooltip__items">
        ${items.map(it => `<li>${escapeHtml(it)}</li>`).join('')}
      </ul>
    `;

    // Make the tooltip measurable before positioning. We have to unset
    // hidden first to read its bounding box, otherwise dimensions are 0.
    tip.hidden = false;
    tip.style.left = '0px';
    tip.style.top  = '0px';

    // Position next to the edge midpoint, offset above so the tooltip
    // doesn't cover the line. Clamp into the canvas so it stays usable
    // for edges near borders.
    const mid = getEdgeMidpoint(refs.line);
    const canvasRect = els.canvas.getBoundingClientRect();
    const tipRect = tip.getBoundingClientRect();
    const tw = tipRect.width;
    const th = tipRect.height;

    let cx, cy;
    if (mid) {
      cx = mid.x;
      cy = mid.y;
    } else {
      // Fallback to canvas center if path measurement fails
      cx = canvasRect.width / 2;
      cy = canvasRect.height / 2;
    }

    // Place above the edge midpoint by default; if it would clip the
    // top of the canvas, flip below.
    const GAP = 14;
    let left = cx - tw / 2;
    let top  = cy - th - GAP;
    if (top < 8) top = cy + GAP;

    // Clamp horizontally to the canvas
    const maxLeft = canvasRect.width - tw - 8;
    if (left < 8)         left = 8;
    if (left > maxLeft)   left = Math.max(8, maxLeft);

    tip.style.left = left + 'px';
    tip.style.top  = top  + 'px';

    // Trigger fade-in on next frame so the transition runs from opacity 0
    requestAnimationFrame(() => tip.classList.add('is-visible'));
  }

  // ============================================================
  // EDGE creation / deletion helpers
  // ============================================================
  function hasEdge(fromId, toId) {
    return activeBoard().data.edges.some(e => e.from === fromId && e.to === toId);
  }

  function createEdge(fromId, toId, opts = {}) {
    if (fromId === toId) return null;
    if (hasEdge(fromId, toId)) return null;
    pushUndoSnapshot('create-edge');
    const board = activeBoard();
    const id = 'e' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5);
    const edge = {
      id,
      from: fromId,
      to:   toId,
      type: opts.type || 'manual',
      direction:    opts.direction    || 'forward',
      sourceAnchor: opts.sourceAnchor || 'auto',
      targetAnchor: opts.targetAnchor || 'auto',
      meta: opts.meta || {
        protocol:   'in-process',
        payload:    '—',
        latency:    0,
        throughput: '—',
      },
      dataItems: Array.isArray(opts.dataItems) ? opts.dataItems.slice() : [],
      // Default new connections to "process" — workflow progression.
      // Users can re-classify to "data" via the inspector if the edge
      // actually represents a pure data/information handoff.
      kind: opts.kind === 'data' ? 'data' : 'process',
      label: typeof opts.label === 'string' ? opts.label : '',
      waypoints: Array.isArray(opts.waypoints)
        ? opts.waypoints.filter(p => p && Number.isFinite(p.x) && Number.isFinite(p.y))
                        .map(p => ({ x: p.x, y: p.y }))
        : [],
    };
    board.data.edges.push(edge);

    // Render just this new edge instead of re-rendering all edges
    const refs = buildEdge(edge);
    els.edgesGroup.appendChild(refs.g);
    edgeEls.set(edge.id, refs);
    refreshEdgeStyle(edge);
    updateEdgePath(edge);

    touchBoard();
    renderBoardList();
    return id;
  }

  function deleteEdge(edgeId) {
    const board = activeBoard();
    const idx = board.data.edges.findIndex(e => e.id === edgeId);
    if (idx === -1) return false;
    board.data.edges.splice(idx, 1);

    // Hide tooltip if it was showing this edge
    hideEdgeTooltip();

    // Remove DOM (edge group + label sibling)
    const refs = edgeEls.get(edgeId);
    if (refs && refs.g.parentNode) refs.g.parentNode.removeChild(refs.g);
    edgeEls.delete(edgeId);
    removeEdgeLabel(edgeId);

    // Clear waypoint selection if it pointed at this edge
    if (selectedWaypoint && selectedWaypoint.edgeId === edgeId) selectedWaypoint = null;

    // Clear selection if it was this edge
    if (selectedKind === 'edge' && selectedEdgeId === edgeId) clearSelection();

    touchBoard();
    renderBoardList();
    return true;
  }

  function deleteSelectedNode() {
    if (selectedKind !== 'node' || !selectedNodeId) return;
    const board = activeBoard();
    const node  = board.data.nodes.find(n => n.id === selectedNodeId);
    if (!node) return;

    const ok = window.confirm(
      `Delete step "${node.title}"?\n` +
      `All connected arrows will also be removed. This cannot be undone.`
    );
    if (!ok) return;

    pushUndoSnapshot('delete-node');

    // Hide any open tooltip — connected edges are about to be destroyed.
    hideEdgeTooltip();

    const nodeId = node.id;

    // 1) Remove every edge touching this node — DOM + state
    const doomedEdges = board.data.edges.filter(e => e.from === nodeId || e.to === nodeId);
    doomedEdges.forEach(e => {
      const refs = edgeEls.get(e.id);
      if (refs && refs.g.parentNode) refs.g.parentNode.removeChild(refs.g);
      edgeEls.delete(e.id);
    });
    board.data.edges = board.data.edges.filter(e => e.from !== nodeId && e.to !== nodeId);

    // 2) Remove the node — DOM + state
    const nodeEl = nodeEls.get(nodeId);
    if (nodeEl && nodeEl.parentNode) nodeEl.parentNode.removeChild(nodeEl);
    nodeEls.delete(nodeId);
    // Also remove the documents panel (sibling DOM element).
    removeNodeDocs(nodeId);
    board.data.nodes = board.data.nodes.filter(n => n.id !== nodeId);

    // 3) Clear selection + refresh inspector + sidebar
    _resetSelectionState();
    renderInspector();
    renderBoardList();
    touchBoard();
    showToast('Step deleted');
    scheduleSave('delete-node');
  }

  function deleteSelectedEdge() {
    if (selectedKind !== 'edge' || !selectedEdgeId) return;
    const ok = window.confirm('Delete this connection?');
    if (!ok) return;
    pushUndoSnapshot('delete-edge');
    const id = selectedEdgeId;
    if (deleteEdge(id)) {
      showToast('Connection deleted');
      scheduleSave('delete-edge');
    }
  }

  function _refreshNodeSelectionVisual(prevId, nextId) {
    [prevId, nextId].forEach(id => {
      if (!id) return;
      const n = activeBoard().data.nodes.find(x => x.id === id);
      if (n) refreshNodeClass(n);
    });
  }

  function selectNode(id) {
    // Clear any edge selection first
    if (selectedKind === 'edge' && selectedEdgeId) {
      const prevEdge = activeBoard().data.edges.find(e => e.id === selectedEdgeId);
      selectedEdgeId = null;
      if (prevEdge) refreshEdgeStyle(prevEdge);
    }
    const prevNode = selectedNodeId;
    selectedKind   = 'node';
    selectedNodeId = id;
    selectedEdgeId = null;
    _refreshNodeSelectionVisual(prevNode, id);
    renderInspector();
  }

  function selectEdge(id) {
    // Clear any node selection first
    if (selectedKind === 'node' && selectedNodeId) {
      const prevNodeId = selectedNodeId;
      selectedNodeId = null;
      _refreshNodeSelectionVisual(prevNodeId, null);
    }
    // Selecting a different edge invalidates any waypoint selection.
    if (selectedWaypoint && selectedWaypoint.edgeId !== id) clearWaypointSelection();
    const prev = selectedEdgeId;
    selectedKind   = 'edge';
    selectedEdgeId = id;
    selectedNodeId = null;
    if (prev) {
      const e = activeBoard().data.edges.find(x => x.id === prev);
      if (e) refreshEdgeStyle(e);
    }
    const edge = activeBoard().data.edges.find(x => x.id === id);
    if (edge) refreshEdgeStyle(edge);
    renderInspector();
  }

  function clearSelection() {
    if (!selectedKind) return;
    clearWaypointSelection();
    const prevNodeId = selectedNodeId;
    const prevEdgeId = selectedEdgeId;
    selectedKind   = null;
    selectedNodeId = null;
    selectedEdgeId = null;
    if (prevNodeId) _refreshNodeSelectionVisual(prevNodeId, null);
    if (prevEdgeId) {
      const edge = activeBoard().data.edges.find(e => e.id === prevEdgeId);
      if (edge) refreshEdgeStyle(edge);
    }
    renderInspector();
  }

  // Empty SVG canvas click → clear selection
  els.edgeSvg.addEventListener('click', (e) => {
    if (e.target === els.edgeSvg) clearSelection();
  });

  // ============================================================
  // INSPECTOR — router + renderers
  // ============================================================
  function renderInspector() {
    // Reset header to neutral; the specific renderer can re-style it.
    const eyebrow = document.getElementById('inspectorEyebrow');
    const title   = document.getElementById('inspectorTitle');

    if (!selectedKind) {
      eyebrow.textContent = 'Inspector';
      title.innerHTML = 'Step &amp; edge<br/><em>details</em>';
      els.inspectorEmpty.hidden = false;
      els.inspectorContent.hidden = true;
      els.inspectorContent.innerHTML = '';
      return;
    }

    if (selectedKind === 'node') {
      eyebrow.textContent = 'Step';
      title.innerHTML = 'Edit <em>step</em>';
      renderNodeInspector();
      return;
    }

    if (selectedKind === 'edge') {
      eyebrow.textContent = 'Edge';
      title.innerHTML = 'Edit <em>connection</em>';
      renderEdgeInspector();
      return;
    }
  }

  // ----- NODE inspector --------------------------------------------------

            </button>

IMBA Contracts">${escapeHtml((node.documents || []).join('\n'))}</textarea>

    els.inspectorEmpty.hidden = true;
    els.inspectorContent.hidden = false;

    // Delete-step button
    const delBtn = els.inspectorContent.querySelector('[data-action="delete-node"]');
    if (delBtn) delBtn.addEventListener('click', deleteSelectedNode);

    // Wire up text inputs — commit on input (live) so the user sees changes
    // reflected on the canvas immediately. Save is debounced so this stays cheap.
    //
    // History: snapshot on focus once per editing session, discard on
    // blur if the field is unchanged. This gives one undo step per
    // "started editing → done editing" gesture instead of one per
    // keystroke.
    els.inspectorContent.querySelectorAll('.np__input, .np__textarea').forEach(input => {
      const field = input.dataset.field;
      let focusValue = null;
      input.addEventListener('focus', () => {
        focusValue = input.value;
        pushUndoSnapshot('inspector-edit-' + (field || 'field'));
      });
      input.addEventListener('blur', () => {
        if (focusValue !== null && input.value === focusValue) {
          discardLastSnapshot();
        }
        focusValue = null;
      });
      input.addEventListener('input', () => {
        const val = (input.value || '').trim() || (field === 'sub' ? '' : '—');
        if (node[field] === val) return;
        node[field] = val;

        // Update the corresponding inline content on the canvas without
        // re-rendering the node — preserves AI animations and avoids flicker.
        const nodeEl = nodeEls.get(node.id);
        if (nodeEl) {
          const inline = nodeEl.querySelector(`[data-field="${field}"]`);
          if (inline && inline.textContent !== val) inline.textContent = val;
        }

        touchBoard();
        renderBoardList(); // titles can show in board cards
        scheduleSave('inspector-edit');
      });
    });

    // Type segmented toggle
    els.inspectorContent.querySelector('[data-seg="type"]').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const newType = btn.dataset.val;

        node.type = newType;

        // Panel accent follows the node's type — re-render for the colour swap.
        renderNodeDocs(node);

        showToast(`${node.title} → ${newType === 'ai' ? 'AI mode' : 'manual mode'}`);

    // Shape segmented toggle — changing shape requires rebuilding the node DOM
    // because decision and process have different inner markup (no inline sub).
    els.inspectorContent.querySelector('[data-seg="shape"]').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const newShape = btn.dataset.val;
        if (newShape === (node.shape || 'process')) return;
        pushUndoSnapshot('inspector-shape');
        node.shape = newShape;

        // Rebuild this single node's DOM so its inner structure matches the new shape.
        const oldEl = nodeEls.get(node.id);
        const newEl = buildNode(node);
        if (oldEl && oldEl.parentNode) oldEl.parentNode.replaceChild(newEl, oldEl);
        nodeEls.set(node.id, newEl);

        // Re-render the documents panel so its accent class follows the
        // new shape and its hover wiring binds to the rebuilt node DOM.
        renderNodeDocs(node);

        // Edges connected to this node need their paths recomputed because
        // anchor points depend on shape.
        updateEdgesForNode(node.id);

        touchBoard();
        renderNodeInspector();
        renderBoardList();
        showToast(`${node.title} → ${newShape}`);
        scheduleSave('inspector-shape');
      });
    });

    // Generated Documents — textarea live-parses each non-empty line into
    // node.documents. We re-render the canvas panel on every input so the
    // user sees the panel update as they type.
    const docsEl = els.inspectorContent.querySelector('[data-action="edit-documents"]');
    if (docsEl) {
      // History: one undo step per editing session, same pattern as
      // the other inspector text fields.
      let docsFocusValue = null;
      docsEl.addEventListener('focus', () => {
        docsFocusValue = docsEl.value;
        pushUndoSnapshot('node-documents');
      });
      docsEl.addEventListener('blur', () => {
        if (docsFocusValue !== null && docsEl.value === docsFocusValue) {
          discardLastSnapshot();
        }
        docsFocusValue = null;
      });
      docsEl.addEventListener('input', () => {
        const next = parseNodeDocuments(docsEl.value);
        const prev = node.documents || [];
        const same = prev.length === next.length && prev.every((v, i) => v === next[i]);
        if (same) return;
        node.documents = next;

        // Auto-disable showDocuments if the list became empty — saves the
        // user from having a pinned panel that secretly shows nothing.
        if (next.length === 0 && node.showDocuments) node.showDocuments = false;

        renderNodeDocs(node);

        // Update the toggle's enabled/disabled state to reflect the new
        // documents count without re-rendering the whole inspector
        // (which would steal focus from the textarea).
        const toggleLabel = els.inspectorContent.querySelector('[data-action="toggle-show-documents"]');
        const toggleInput = toggleLabel && toggleLabel.querySelector('input[type="checkbox"]');
        if (toggleLabel && toggleInput) {
          if (next.length === 0) {
            toggleLabel.style.opacity = '0.45';
            toggleLabel.style.pointerEvents = 'none';
            toggleInput.disabled = true;
            toggleInput.checked = false;
          } else {
            toggleLabel.style.opacity = '';
            toggleLabel.style.pointerEvents = '';
            toggleInput.disabled = false;
            toggleInput.checked = !!node.showDocuments;
          }
        }

        touchBoard();
        scheduleSave('node-documents');
      });
    }

    // Show-on-canvas toggle — flips node.showDocuments and re-renders
    // the panel so it switches between pinned and hover-preview modes.
    const showToggleLabel = els.inspectorContent.querySelector('[data-action="toggle-show-documents"]');
    const showToggleInput = showToggleLabel && showToggleLabel.querySelector('input[type="checkbox"]');
    if (showToggleInput) {
      showToggleInput.addEventListener('change', () => {
        pushUndoSnapshot('node-show-documents');
        node.showDocuments = !!showToggleInput.checked;
        renderNodeDocs(node);
        touchBoard();
        scheduleSave('node-show-documents');
      });
    }
  }

            placeholder="customer email
ticket category
CRM customer profile">${escapeHtml((edge.dataItems || []).join('\n'))}</textarea>
          <span class="k" style="opacity:0.7;letter-spacing:0.06em;text-transform:none;font-size:10px;">
            One line = one data item flowing through this connection.
          </span>

        <div class="np__danger">
          <button class="np__danger-btn" data-action="delete-edge" type="button" title="Delete this connection">
            <svg aria-hidden="true"><use href="#icon-trash"/></svg>
            Delete connection
          </button>
        </div>
      </div>
    `;
    els.inspectorEmpty.hidden = true;
    els.inspectorContent.hidden = false;

    document.getElementById('edgeToggle').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const newType = btn.dataset.edgeType;
        if (newType === edge.type) return;
        pushUndoSnapshot('toggle-edge');
        edge.type = newType;
        refreshEdgeStyle(edge);
        renderEdgeInspector();
        renderBoardList();
        touchBoard();
        const typeToast = newType === 'ai' ? 'AI flow' : newType === 'automated' ? 'automated flow' : 'manual flow';
        showToast(`Edge ${edge.id} → ${typeToast}`);
        scheduleSave('toggle-edge');
      });
    });

    document.getElementById('edgeDirToggle').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const newDir = btn.dataset.edgeDir;
        if (newDir === edge.direction) return;
        pushUndoSnapshot('toggle-edge-dir');
        edge.direction = newDir;
        refreshEdgeStyle(edge);
        renderEdgeInspector();
        touchBoard();
        showToast(`Edge ${edge.id} → ${newDir === 'bidirectional' ? 'two-way' : 'one-way'}`);
        scheduleSave('toggle-edge-dir');
      });
    });

    // Kind toggle — process flow ↔ data transfer. Only the visual line
    // pattern changes; arrowheads, AI animation, dataItems, and the
    // inspector layout stay intact. refreshEdgeStyle re-applies the
    // class composition which the CSS uses to dash the line.
    document.getElementById('edgeKindToggle').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const newKind = btn.dataset.edgeKind;
        if (newKind === edge.kind) return;
        pushUndoSnapshot('toggle-edge-kind');
        edge.kind = newKind;
        refreshEdgeStyle(edge);
        renderEdgeInspector();
        touchBoard();
        showToast(`Edge ${edge.id} → ${newKind === 'data' ? 'data transfer' : 'process flow'}`);
        scheduleSave('toggle-edge-kind');
      });
    });

    const delEdgeBtn = els.inspectorContent.querySelector('[data-action="delete-edge"]');
    if (delEdgeBtn) delEdgeBtn.addEventListener('click', deleteSelectedEdge);

    // Transferred Data textarea — parse each non-empty line into one
    // entry in edge.dataItems. We commit on input (live) so toggling to
    // hover the edge afterwards immediately shows the new tooltip
    // contents. Save is debounced so this stays cheap.
    const dataItemsEl = els.inspectorContent.querySelector('[data-action="edit-data-items"]');
    if (dataItemsEl) {
      // History: one undo step per editing session, mirroring the
      // other inspector text fields.
      let dataFocusValue = null;
      dataItemsEl.addEventListener('focus', () => {
        dataFocusValue = dataItemsEl.value;
        pushUndoSnapshot('edge-data-items');
      });
      dataItemsEl.addEventListener('blur', () => {
        if (dataFocusValue !== null && dataItemsEl.value === dataFocusValue) {
          discardLastSnapshot();
        }
        dataFocusValue = null;
      });
      dataItemsEl.addEventListener('input', () => {
        const next = parseEdgeDataItems(dataItemsEl.value);
        // Only mutate / save if the parsed list actually changed —
        // avoids touching the board on whitespace-only edits.
        const prev = edge.dataItems || [];
        const same = prev.length === next.length && prev.every((v, i) => v === next[i]);
        if (same) return;
        edge.dataItems = next;
        touchBoard();
        scheduleSave('edge-data-items');
      });
    }

    // Edge label — short text rendered as a pill on the path. Live
    // update so the user sees the pill appear/update as they type.
    // History: one undo step per editing session, focus/blur pattern.
    const labelEl = els.inspectorContent.querySelector('[data-action="edit-edge-label"]');
    if (labelEl) {
      let labelFocusValue = null;
      labelEl.addEventListener('focus', () => {
        labelFocusValue = labelEl.value;
        pushUndoSnapshot('edge-label');
      });
      labelEl.addEventListener('blur', () => {
        if (labelFocusValue !== null && labelEl.value === labelFocusValue) {
          discardLastSnapshot();
        }
        labelFocusValue = null;
      });
      labelEl.addEventListener('input', () => {
        const next = (labelEl.value || '').trim();
        if ((edge.label || '') === next) return;
        edge.label = next;
        renderEdgeLabel(edge);
        touchBoard();
        scheduleSave('edge-label');
      });
    }

    // Clear-waypoints button — wipes all waypoints on this edge in one
    // action. The button only renders when waypoints exist.
    const clearWpBtn = els.inspectorContent.querySelector('[data-action="clear-waypoints"]');
    if (clearWpBtn) {
      clearWpBtn.addEventListener('click', () => {
        if (!edge.waypoints || edge.waypoints.length === 0) return;
        pushUndoSnapshot('clear-waypoints');
        edge.waypoints = [];
        clearWaypointSelection();
        updateEdgePath(edge);
        renderEdgeInspector();
        touchBoard();
        scheduleSave('clear-waypoints');
      });
    }
  }

  /**
   * Compute AI / Automated / Human automation breakdown for a board.
   *
   * Counting rules (per spec):
   *   - Database nodes are EXCLUDED entirely.
   *   - Every non-database node counts once. AI if node.type === 'ai',
   *     otherwise Human.
   *   - Every edge counts once. AI if edge.type === 'ai', Automated if
   *     edge.type === 'automated', otherwise Human.
   *   - When the board has no countable items, all percentages are 0.
   */
  function getAutomationStats(board) {
    const nodes = (board?.data?.nodes || []).filter(n => (n.shape || 'process') !== 'database');
    const edges = board?.data?.edges || [];
    const total = nodes.length + edges.length;
    const ai = nodes.filter(n => n.type === 'ai').length
             + edges.filter(e => e.type === 'ai').length;
    const automated = edges.filter(e => e.type === 'automated').length;
    const human = total - ai - automated;
    const aiPercent        = total === 0 ? 0 : Math.round((ai / total) * 100);
    const automatedPercent = total === 0 ? 0 : Math.round((automated / total) * 100);
    const humanPercent     = total === 0 ? 0 : Math.max(0, 100 - aiPercent - automatedPercent);
    return { total, ai, automated, human, aiPercent, automatedPercent, humanPercent };
  }

  function renderAutomationStats() {
    const stats = getAutomationStats(activeBoard());
    if (els.autoStatsAi)       els.autoStatsAi.textContent       = stats.aiPercent + '%';
    if (els.autoStatsAuto)     els.autoStatsAuto.textContent     = stats.automatedPercent + '%';
    if (els.autoStatsHuman)    els.autoStatsHuman.textContent    = stats.humanPercent + '%';
    if (els.autoStatsBarAi)    els.autoStatsBarAi.style.width    = stats.aiPercent + '%';
    if (els.autoStatsBarAuto)  els.autoStatsBarAuto.style.width  = stats.automatedPercent + '%';
    if (els.autoStatsBarHuman) els.autoStatsBarHuman.style.width = stats.humanPercent + '%';
  }

  function renderBoardList() {
    // Re-derive automation stats on every board-list refresh. This single
    // call site covers every mutation that changes node/edge counts or
    // types, since renderBoardList is already invoked from add/delete/
    // toggle/switch/clone/load paths.
    renderAutomationStats();

    els.boardsList.innerHTML = '';

    // Sort: most recently updated first, but keep active visually pinned via scrollIntoView
    const sorted = [...workspace.boards].sort((a, b) => {
      return new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime();
    });

    sorted.forEach(b => {
      const card = document.createElement('div');
      card.className = `board-card${b.id === workspace.activeBoardId ? ' is-active' : ''}`;
      card.dataset.id = b.id;

      const aiTotal = aiCount(b);
      const totalSteps = b.data.nodes.length;
      const totalEdges = b.data.edges.length;

      // Show delete only if more than 1 board
      const canDelete = workspace.boards.length > 1;

      card.innerHTML = `
        <div class="board-card__head">
          <div class="board-card__title">${escapeHtml(b.name)}</div>
          <div class="board-card__version">v${escapeHtml(b.version)}</div>
        </div>
        <div class="board-card__meta">
          <div class="board-card__stats">
            <span>${totalSteps}n · ${totalEdges}e</span>
            ${aiTotal > 0 ? `<span><span class="ai-dot"></span>${aiTotal} AI</span>` : '<span style="opacity:0.5">No AI</span>'}
          </div>
          <span class="board-card__date">${formatTs(b.updatedAt)}</span>
        </div>
        ${canDelete ? `
          <button class="board-card__del" data-action="delete-board" title="Delete board">
            <svg aria-hidden="true"><use href="#icon-trash"/></svg>
          </button>
        ` : ''}
      `;

      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="delete-board"]')) return;
        switchToBoard(b.id);
      });

      const delBtn = card.querySelector('[data-action="delete-board"]');
      if (delBtn) {
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          confirmDeleteBoard(b.id);
        });
      }

      els.boardsList.appendChild(card);
    });
  }

  function confirmDeleteBoard(id) {
    const b = workspace.boards.find(x => x.id === id);
    if (!b) return;
    if (workspace.boards.length <= 1) {
      showToast('Cannot delete the last board');
      return;
    }
    const ok = window.confirm(`Delete board "${b.name}"?\nThis cannot be undone.`);
    if (!ok) return;
    deleteBoard(id);

  function deleteBoard(id) {
    if (workspace.boards.length <= 1) return;
    const idx = workspace.boards.findIndex(b => b.id === id);
    if (idx === -1) return;
    pushUndoSnapshot('delete-board');
    const wasActive = workspace.activeBoardId === id;
    workspace.boards.splice(idx, 1);
    if (wasActive) {
      // Pick most recently updated remaining board
      const next = [...workspace.boards].sort((a, b) =>
        new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime()
      )[0];
      workspace.activeBoardId = next.id;
      _resetSelectionState();
      fullRender();
    } else {
      renderBoardList();
    }
    showToast('Board deleted');
    scheduleSave('delete-board');

  // ============================================================
  // RESIZE

  let resizeRaf = null;
