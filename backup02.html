<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIFlow Canvas — Workspace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg-base:        #08090f;
  --bg-elev-1:      #0d0f17;
  --bg-elev-2:      #131623;
  --bg-elev-3:      #1a1d2b;
  --bg-glass:       rgba(20, 23, 35, 0.55);
  --bg-glass-strong:rgba(20, 23, 35, 0.78);

  --stroke-subtle:  rgba(255, 255, 255, 0.06);
  --stroke-soft:    rgba(255, 255, 255, 0.10);
  --stroke-medium:  rgba(255, 255, 255, 0.18);

  --text-primary:   #ebecf2;
  --text-secondary: #969aab;
  --text-muted:     #5c6072;
  --text-faint:     #3a3d49;

  --manual-bg-1:    #181b27;
  --manual-bg-2:    #131622;
  --manual-border:  #2c3142;
  --manual-stroke:  #4f546a;

  --auto-1:         #22d3ee;
  --auto-2:         #38bdf8;
  --auto-stroke:    #44d7f5;
  --auto-stroke-sel:#8cebff;
  --auto-glow:      rgba(68, 215, 245, 0.38);

  --ai-1: #7c3aed;
  --ai-2: #c026d3;
  --ai-3: #ec4899;
  --ai-4: #06b6d4;
  --ai-5: #8b5cf6;

  --accent:        #a78bfa;
  --accent-glow:   rgba(167, 139, 250, 0.4);

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

/* ============================================================
   RESET + BASE
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter Tight', sans-serif;
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-base);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.005em;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
[contenteditable] { outline: none; }
[contenteditable]:focus {
  background: rgba(167, 139, 250, 0.08);
  border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(167, 139, 250, 0.4);
}

/* ============================================================
   APP SHELL
   3 columns: canvas | inspector | board sidebar
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: 56px 1fr;
  grid-template-columns: 1fr 320px 280px;
  grid-template-areas:
    "topbar topbar topbar"
    "canvas inspector boards";
  height: 100vh;
  width: 100vw;
}

/* ----- TOPBAR ----- */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--bg-elev-1);
  border-bottom: 1px solid var(--stroke-subtle);
  z-index: 30;
  gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
.brand__mark {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, var(--ai-1), var(--ai-3), var(--ai-4));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand__name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.brand__sep { width: 1px; height: 16px; background: var(--stroke-soft); margin: 0 4px; align-self: center; }

/* Centered board title + version */
.topbar__center {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-width: 0;
}
.board-title {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: 18px;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 260px;
  cursor: text;
  padding: 2px 8px;
  border-radius: 6px;
}
.board-title:hover { background: rgba(255,255,255,0.04); }
.version-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(124,58,237,0.18), rgba(236,72,153,0.18));
  border: 1px solid rgba(167,139,250,0.4);
  color: #f0d9ff;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.version-pill .ts {
  color: var(--text-muted);
  font-size: 9px;
  letter-spacing: 0.08em;
  border-left: 1px solid rgba(167,139,250,0.25);
  padding-left: 6px;
}

/* ============================================================
   AUTOMATION-STATS PILL
   A compact dashboard indicator showing the ratio of AI, automated,
   and human work in the workflow.

   Layout: a wide pill with two rows.
     row 1 — labels: AI | Auto | Human
     row 2 — segmented bar with matching fills

   The numbers come from renderAutomationStats() which writes into
   #autoStatsAi / #autoStatsAuto / #autoStatsHuman. The bar segment
   widths are set on the matching fill spans from the same function.
   ============================================================ */
.auto-stats {
  display: inline-flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 252px;
  height: 34px;
  padding: 5px 12px 6px;
  border-radius: 999px;
  background: rgba(15, 17, 24, 0.7);
  border: 1px solid rgba(167, 139, 250, 0.18);
  /* Glow lives on the container, not on the digits — keeps text crisp.
     Slightly stronger than before to compensate for removing the
     text-shadow on the AI value. */
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.02) inset,
    0 0 22px -8px rgba(167, 139, 250, 0.5);
  flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  cursor: default;
  position: relative;
}

/* Row 1 — labels */
.auto-stats__row--labels {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: baseline;
  gap: 6px;
  line-height: 1;
}
.auto-stats__seg {
  display: inline-flex;
  align-items: baseline;
  justify-content: flex-start;
  gap: 6px;
  white-space: nowrap;
  min-width: 0;
}
.auto-stats__seg--auto { justify-content: center; }
.auto-stats__seg--human { justify-content: flex-end; }
.auto-stats__lbl {
  text-transform: uppercase;
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.14em;
  opacity: 0.85;
}
.auto-stats__val {
  /* Crisp legibility wins over decorative effects: solid color, balanced
     size, semibold weight. Subpixel hinting works correctly here because
     we no longer clip a gradient onto the text or stack drop-shadows. */
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* AI label */
.auto-stats__seg--ai .auto-stats__lbl {
  color: var(--accent);
  opacity: 0.9;
}
/* AI value — soft lavender-tinted off-white. Bright enough to dominate
   visually, soft enough not to overpower the rest of the topbar. The
   gradient identity lives on the bar fill and the container border. */
.auto-stats__seg--ai .auto-stats__val {
  color: #d8d2f0;
}

/* Automated label — crisp system cyan, distinct from AI shimmer */
.auto-stats__seg--auto .auto-stats__lbl {
  color: var(--auto-stroke);
  opacity: 0.92;
}
.auto-stats__seg--auto .auto-stats__val {
  color: #d8faff;
}

/* Human label — muted, calm, secondary */
.auto-stats__seg--human .auto-stats__lbl {
  color: var(--text-muted);
}
.auto-stats__seg--human .auto-stats__val {
  /* Slightly cooler off-white that defers to the AI side */
  color: #aab0bf;
  font-weight: 500;
}

/* Row 2 — split progress bar */
.auto-stats__bar {
  display: flex;
  height: 3px;
  width: 100%;
  border-radius: 999px;
  background: rgba(79, 84, 106, 0.18);
  overflow: hidden;
}
.auto-stats__bar-fill {
  display: block;
  flex: 0 0 auto;
  height: 100%;
  width: 0%;
  transition: width 280ms cubic-bezier(.2,.8,.2,1);
}
.auto-stats__bar-fill--ai {
  background: linear-gradient(90deg,
    var(--ai-1) 0%,
    var(--ai-2) 35%,
    var(--ai-3) 65%,
    var(--ai-4) 100%);
  box-shadow:
    0 0 8px rgba(167, 139, 250, 0.6),
    0 0 14px rgba(236, 72, 153, 0.35);
}
.auto-stats__bar-fill--automated {
  background: linear-gradient(90deg, var(--auto-1), var(--auto-2));
  box-shadow: 0 0 10px rgba(34, 211, 238, 0.32);
}
.auto-stats__bar-fill--human {
  background: var(--manual-stroke);
}

.topbar__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.tbtn {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  background: var(--bg-elev-2);
  border: 1px solid var(--stroke-soft);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
  transition: all 160ms ease;
  white-space: nowrap;
}
.tbtn:hover { color: var(--text-primary); border-color: var(--stroke-medium); }
.tbtn--accent {
  background: linear-gradient(90deg, rgba(124,58,237,0.18), rgba(236,72,153,0.18));
  border-color: rgba(167, 139, 250, 0.4);
  color: #f0d9ff;
}
.tbtn--accent:hover { box-shadow: 0 0 16px rgba(167, 139, 250, 0.25); border-color: rgba(167, 139, 250, 0.7); }
.tbtn svg { width: 12px; height: 12px; flex-shrink: 0; }

/* ============================================================
   CANVAS
   ============================================================ */
.canvas {
  grid-area: canvas;
  position: relative;
  overflow: hidden;
  background-color: var(--bg-base);
  background-image:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(124, 58, 237, 0.07), transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 70%, rgba(6, 182, 212, 0.05), transparent 70%),
    radial-gradient(circle, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
  background-size: auto, auto, 22px 22px;
}
.canvas.is-dragging * { cursor: grabbing !important; }
.canvas__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.nodes-layer { position: absolute; inset: 0; pointer-events: none; }

/* Horizontal alignment guide rendered while dragging a node when its
   vertical center aligns with another node's. Sits above edges and
   nodes so the user can see the guide cross any other element it
   passes over. Pointer-events disabled — purely visual feedback. */
.alignment-guide {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: rgba(167, 139, 250, 0.55);
  box-shadow: 0 0 10px rgba(167, 139, 250, 0.35);
  pointer-events: none;
  opacity: 0;
  transition: opacity 80ms ease;
  z-index: 4;
}
.alignment-guide.is-visible { opacity: 1; }

/* Loading veil */
.canvas-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-base);
  z-index: 20;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  transition: opacity 300ms ease;
}
.canvas-loading.is-hidden { opacity: 0; pointer-events: none; }

/* ============================================================
   NODE
   ============================================================ */
.node {
  position: absolute;
  width: 220px;
  border-radius: var(--radius-md);
  pointer-events: auto;
  user-select: none;
  transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 200ms ease;
  will-change: transform;
}
.node.is-dragging { transition: none; z-index: 100; transform: scale(1.02); cursor: grabbing; }
.node__inner { position: relative; padding: 14px 16px; z-index: 2; }
.node__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; gap: 8px;
}
.node__kind {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.node__title {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 500;
  font-size: 14.5px;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  line-height: 1.3;
  margin-bottom: 4px;
}
.node__sub { font-size: 11.5px; color: var(--text-secondary); line-height: 1.45; }
.node__drag { cursor: grab; }
.node.is-dragging .node__drag { cursor: grabbing; }

/* MANUAL */
.node--manual {
  background: linear-gradient(180deg, var(--manual-bg-1), var(--manual-bg-2));
  border: 1px solid var(--manual-border);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 8px 24px rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.node--manual .node__kind::before {
  content: ""; display: inline-block;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--manual-stroke);
}

/* AI */
.node--ai {
  background: transparent;
  border: none;
  isolation: isolate;
  animation: aiGlowPulse 3.2s ease-in-out infinite;
}
.node--ai::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: calc(var(--radius-md) + 2px);
  padding: 2px;
  background: conic-gradient(
    from var(--angle, 0deg),
    var(--ai-1), var(--ai-2), var(--ai-3), var(--ai-4), var(--ai-5), var(--ai-1)
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  animation: aiBorderSpin 4s linear infinite;
  z-index: 0;
  pointer-events: none;
}
.node--ai::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, #15111f 0%, #100c1a 100%);
  z-index: 1;
}
.node--ai .node__kind { color: var(--accent); }
.node--ai .node__kind::before {
  content: ""; display: inline-block;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--ai-3);
  box-shadow: 0 0 6px var(--ai-3);
}
@property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes aiBorderSpin { to { --angle: 360deg; } }
@keyframes aiGlowPulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(167,139,250,0.10), 0 0 24px -4px rgba(124,58,237,0.45), 0 0 60px -10px rgba(192,38,211,0.30); }
  50%      { box-shadow: 0 0 0 1px rgba(167,139,250,0.20), 0 0 38px -2px rgba(124,58,237,0.65), 0 0 90px -8px rgba(192,38,211,0.50); }
}

/* AI TOGGLE BUTTON */
.node__toggle {
  flex-shrink: 0;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--stroke-soft);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 200ms ease;
  position: relative;
  z-index: 3;
}
.node__toggle:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text-secondary);
  border-color: var(--stroke-medium);
}
.node__toggle svg { width: 14px; height: 14px; }
.node--ai .node__toggle {
  background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(236,72,153,0.25));
  border-color: rgba(167,139,250,0.5);
  color: #f0d9ff;
  box-shadow: 0 0 12px rgba(167,139,250,0.3);
}
.node--ai .node__toggle:hover { box-shadow: 0 0 16px rgba(167,139,250,0.5); }
.node--ai .node__toggle svg {
  filter: drop-shadow(0 0 4px rgba(236,72,153,0.6));
  animation: sparkleSpin 6s linear infinite;
}
@keyframes sparkleSpin {
  0%   { transform: rotate(0deg)   scale(1);    }
  50%  { transform: rotate(180deg) scale(1.15); }
  100% { transform: rotate(360deg) scale(1);    }
}

/* ============================================================
   SELECTED NODE STATE
   Subtle for manual, stronger glow for AI. Decision shape inherits
   the same selection treatment because selection lives on .node.
   ============================================================ */
.node.is-selected.node--manual {
  border-color: rgba(167, 139, 250, 0.55);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 0 0 1px rgba(167, 139, 250, 0.25),
    0 8px 28px rgba(0,0,0,0.5),
    0 0 22px -4px rgba(167, 139, 250, 0.45);
}
.node.is-selected.node--ai {
  /* Replace the looping pulse with a stronger steady glow while selected */
  animation: none;
  box-shadow:
    0 0 0 1px rgba(167, 139, 250, 0.35),
    0 0 30px -2px rgba(124, 58, 237, 0.75),
    0 0 80px -6px rgba(236, 72, 153, 0.55);
}

/* ============================================================
   DECISION SHAPE (diamond)
   Implementation: keep the rectangular bounding box for layout +
   pointer math (offsetWidth/Height stays correct, drag stays correct,
   contenteditable stays correct), but rotate a square pseudo-layer 45°
   to draw the diamond border. Content stays upright inside.

   Footprint is a fixed SQUARE so the rotated-square trick produces a
   perfect diamond whose horizontal vertices align with the left/right
   edges of the bounding box. This makes edge anchoring trivial:
   the same left/right midpoints used for process nodes also touch
   the diamond's pointed sides.
   ============================================================ */
.node--decision {
  width: 180px;
  height: 180px;
}
.node--decision .node__inner {
  /* Fill the square footprint so the entire diamond area is a drag handle.
     The inner content column is constrained separately via flex centering. */
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
  text-align: center;
}
.node--decision .node__inner > * {
  /* Constrain the visible content to the inscribed square */
  max-width: 124px;
}
.node--decision .node__head {
  justify-content: center;
  margin-bottom: 6px;
  width: 100%;
}
.node--decision .node__title {
  font-size: 13.5px;
  margin-bottom: 0;
}
/* Hide kind text + reposition the AI toggle to a corner for decision nodes —
   the kind label is editable in the inspector instead. Keeping the toggle
   reachable matters most for parity with process nodes. */
.node--decision .node__kind {
  font-size: 9px;
  letter-spacing: 0.12em;
}
/* Hide decoration backgrounds on the rectangle itself; the diamond
   pseudo-layer carries all visual styling. */
.node--decision.node--manual {
  background: transparent;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* Manual decision: the rotated square draws the diamond border + fill */
.node--decision.node--manual::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 70.7%;          /* ~1/√2 → rotated square inscribes the box */
  height: 70.7%;
  transform: translate(-50%, -50%) rotate(45deg);
  background: linear-gradient(180deg, var(--manual-bg-1), var(--manual-bg-2));
  border: 1px solid var(--manual-border);
  border-radius: 6px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 8px 24px rgba(0,0,0,0.45);
  z-index: 0;
  pointer-events: none;
}
.node--decision.node--manual.is-selected::before {
  border-color: rgba(167, 139, 250, 0.55);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 0 0 1px rgba(167, 139, 250, 0.25),
    0 8px 28px rgba(0,0,0,0.5),
    0 0 22px -4px rgba(167, 139, 250, 0.45);
}
/* Disable selection box-shadow on the outer .node for decisions —
   we paint it on the rotated ::before so the glow follows the diamond. */
.node--decision.is-selected {
  box-shadow: none;
}

/* AI decision: rotate the existing AI rim + fill pseudos. We override
   the rectangular ::before/::after rather than fighting them. */
.node--decision.node--ai {
  animation: none; /* outer box-shadow pulse would trace a rectangle, not a diamond */
}
.node--decision.node--ai::before {
  /* Animated rainbow rim, but rotated 45° to form a diamond */
  inset: auto;
  top: 50%; left: 50%;
  width: 70.7%;
  height: 70.7%;
  transform: translate(-50%, -50%) rotate(45deg);
  border-radius: 8px;
  /* keep the conic-gradient + mask trick from the rectangular version */
  padding: 2px;
}
.node--decision.node--ai::after {
  inset: auto;
  top: 50%; left: 50%;
  /* Slightly smaller than the rim so the gradient stays visible.
     ::before is 70.7% + 2px padding; ::after sits inside that. */
  width: calc(70.7% - 4px);
  height: calc(70.7% - 4px);
  transform: translate(-50%, -50%) rotate(45deg);
  border-radius: 6px;
  /* Add the AI glow here as a static box-shadow — replaces the
     rectangular pulse animation that wouldn't follow the diamond. */
  box-shadow:
    0 0 24px -4px rgba(124, 58, 237, 0.55),
    0 0 60px -10px rgba(192, 38, 211, 0.35);
}
.node--decision.node--ai.is-selected::after {
  box-shadow:
    0 0 30px -2px rgba(124, 58, 237, 0.85),
    0 0 80px -6px rgba(236, 72, 153, 0.6);
}

/* Decision drag handle: dim the rectangle's borderless area visually */
.node--decision .node__drag { cursor: grab; }
.node--decision.is-dragging .node__drag { cursor: grabbing; }

/* ============================================================
   DATABASE SHAPE (cylinder)
   ------------------------------------------------------------
   Visual language is intentionally cooler and more restrained than
   AI nodes: muted slate-cyan accents, a soft sheen, no animated rim.
   Still clearly distinct from the gray manual rectangle.

   Geometry technique:
     - The .node bounding box is a tall rectangle.
     - .node__inner is rendered as a rectangle with very rounded
       top + bottom edges (border-radius: 50% / 14px). That alone
       reads as a cylinder seen from a slight angle.
     - A ::before pseudo draws the "top lid" — a thin horizontal
       ellipse near the top — which sells the perspective.
   ============================================================ */
:root {
  --db-bg-1:     #0f1a24;       /* deep slate-cyan, top */
  --db-bg-2:     #0a1320;       /* deeper, bottom */
  --db-border:   #2a4358;       /* cool steel border */
  --db-stroke:   #4a7a92;       /* lid stroke + decorative */
  --db-accent:   #6dd3e8;       /* muted cyan highlight */
  --db-glow:     rgba(109, 211, 232, 0.35);
}

.node--database {
  width: 200px;
  /* Override outer styles so the inner pseudo carries everything */
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

/* The cylinder body */
.node--database .node__inner {
  position: relative;
  background: linear-gradient(180deg, var(--db-bg-1) 0%, var(--db-bg-2) 100%);
  border: 1px solid var(--db-border);
  /* Very rounded top + bottom edges create the cylinder silhouette */
  border-radius: 50% / 14px;
  padding: 22px 18px 18px;
  box-shadow:
    /* Inner highlight on the top "lid" suggesting curvature */
    0 1px 0 rgba(109, 211, 232, 0.08) inset,
    /* Soft outer shadow */
    0 8px 24px rgba(0, 0, 0, 0.5),
    /* Subtle cool sheen */
    0 0 24px -8px var(--db-glow);
}

/* Top lid — the ellipse at the cylinder's mouth */
.node--database .node__inner::before {
  content: "";
  position: absolute;
  top: 5px;
  left: 14px;
  right: 14px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid var(--db-stroke);
  background: linear-gradient(180deg,
    rgba(109, 211, 232, 0.10) 0%,
    rgba(15, 26, 36, 0.6) 100%);
  pointer-events: none;
}

/* Decorative data-strip lines below the lid — purely visual */
.node--database .node__inner::after {
  content: "";
  position: absolute;
  top: 22px;
  left: 18px;
  right: 18px;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(109, 211, 232, 0.18) 50%,
    transparent 100%);
  pointer-events: none;
}

/* Reposition kind label so it sits below the lid */
.node--database .node__head {
  margin-top: 6px;
  margin-bottom: 6px;
}
.node--database .node__kind {
  color: var(--db-accent);
  letter-spacing: 0.18em;
  opacity: 0.85;
}
.node--database .node__kind::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--db-accent);
  box-shadow: 0 0 5px var(--db-glow);
}

/* Hover — slightly lift the cool glow */
.node--database:hover .node__inner {
  box-shadow:
    0 1px 0 rgba(109, 211, 232, 0.12) inset,
    0 8px 28px rgba(0, 0, 0, 0.55),
    0 0 28px -6px var(--db-glow);
}

/* Selected — accent border (purple) keeps consistency with other shapes,
   layered on top of the cool body so it reads clearly without clashing. */
.node--database.is-selected .node__inner {
  border-color: rgba(167, 139, 250, 0.55);
  box-shadow:
    0 1px 0 rgba(109, 211, 232, 0.10) inset,
    0 0 0 1px rgba(167, 139, 250, 0.25),
    0 8px 28px rgba(0, 0, 0, 0.55),
    0 0 24px -4px rgba(167, 139, 250, 0.45);
}

/* AI variant — keep the cool palette but add the rainbow rim around the
   cylinder silhouette. We replace the outer ::before/::after pseudos by
   moving cylinder visuals to .node__inner only, so the .node-level AI
   pseudos still render the rim cleanly. */
.node--database.node--ai {
  /* Reuse the existing .node--ai animations (rim + glow pulse). The
     conic-gradient ::before extends slightly beyond the cylinder, but
     the cylinder's tall pill silhouette still reads correctly. */
}
.node--database.node--ai .node__inner {
  /* Tone down the outer glow so it doesn't compete with the AI pulse */
  box-shadow:
    0 1px 0 rgba(109, 211, 232, 0.10) inset,
    0 6px 20px rgba(0, 0, 0, 0.45);
}
.node--database.node--ai .node__kind { color: var(--accent); }
.node--database.node--ai .node__kind::before { background: var(--ai-3); box-shadow: 0 0 6px var(--ai-3); }

/* Database AI rim — needs to follow the cylinder silhouette, not the
   rectangular bounding box. We override both pseudos:
   - ::before (the animated rainbow rim) gets the cylinder radius so it
     traces the pill shape instead of a rectangle.
   - ::after (the dark inner fill) is hidden — the .node__inner cylinder
     body provides its own dark fill, and the rectangular fill would
     bleed outside the cylinder silhouette. */
.node--database.node--ai::before {
  /* Match the cylinder's elliptical top/bottom radius. The "/" here is
     the SVG-style radius syntax (horizontal / vertical), not division. */
  border-radius: 50% / 16px;
}
.node--database.node--ai::after {
  display: none;
}
/* The cylinder body itself becomes the AI dark fill */
.node--database.node--ai .node__inner {
  background: linear-gradient(180deg, #15111f 0%, #100c1a 100%);
  border-color: transparent;
  box-shadow: none;
}
/* Restore the lid ellipse with a more AI-toned color so it stays visible */
.node--database.node--ai .node__inner::before {
  border-color: rgba(167, 139, 250, 0.4);
  background: linear-gradient(180deg,
    rgba(167, 139, 250, 0.10) 0%,
    rgba(21, 17, 31, 0.6) 100%);
}
/* Selected AI database — soft purple ring on the cylinder fill */
.node--database.node--ai.is-selected .node__inner {
  box-shadow:
    0 0 0 1px rgba(167, 139, 250, 0.45),
    0 0 18px -2px rgba(236, 72, 153, 0.4);
}

.node--database .node__drag { cursor: grab; }
.node--database.is-dragging .node__drag { cursor: grabbing; }

/* ============================================================
   EDGES
   ============================================================ */
.edge { cursor: pointer; }
.edge__hit { stroke: transparent; stroke-width: 20; fill: none; }
.edge__line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke-width 180ms ease, opacity 180ms ease;
}

/* Manual edges — calm, restrained, static. */
.edge--manual .edge__line {
  stroke: var(--manual-stroke);
  stroke-width: 1.5;
  opacity: 0.65;
}
.edge--manual:hover .edge__line { opacity: 1; }

/* Automated edges — system-like cyan, deterministic, technical. */
.edge--automated .edge__line {
  stroke: var(--auto-stroke);
  stroke-width: 1.65;
  opacity: 0.92;
  filter: drop-shadow(0 0 3px var(--auto-glow));
}
.edge--automated .edge__shimmer {
  display: block;
  stroke: rgba(140, 240, 255, 0.88);
  stroke-width: 2.1;
  stroke-dasharray: 10 10;
  stroke-dashoffset: 0;
  opacity: 0.52;
  animation: edgeAutoDash 3.4s linear infinite;
}

/* AI edges — only marginally thicker than manual. The visual distinction
   comes from styling and animation, not weight. The base stroke uses
   the slowly-shifting aiFlowGradient; the rainbow flow effect comes
   from the .edge__shimmer overlay below. */
.edge--ai .edge__line {
  stroke: url(#aiFlowGradient);
  stroke-width: 1.7;
  opacity: 0.95;
  /* Soft, small glow — gives the line depth without making it heavier. */
  filter: drop-shadow(0 0 3px rgba(167, 139, 250, 0.55));
}

/* Shimmer overlay — a second path sharing the same `d` as the base
   stroke. It uses the dedicated aiEdgePulseGradient (transparent ends,
   AI rainbow in the middle) which is itself <animate>'d to slide
   across the SVG viewport. The result: a clearly visible coloured
   "energy packet" sweeping along every AI edge in view, while
   non-AI edges show no shimmer at all (display: none). */
.edge__shimmer {
  fill: none;
  stroke: url(#aiEdgePulseGradient);
  stroke-width: 2.25;
  stroke-linecap: round;
  pointer-events: none;
  opacity: 0.95;
  display: none;
}
.edge--ai .edge__shimmer { display: block; }

/* Selection — kept controlled. AI selected edges only nudge up
   slightly in stroke width so they don't suddenly feel chunky. */
.edge.is-selected .edge__line { opacity: 1; }
.edge.is-selected.edge--manual .edge__line {
  stroke: var(--accent);
  stroke-width: 2.5;
  filter: drop-shadow(0 0 6px var(--accent-glow));
}
.edge.is-selected.edge--automated .edge__line {
  stroke: var(--auto-stroke-sel);
  stroke-width: 2.3;
  filter: drop-shadow(0 0 8px rgba(68, 215, 245, 0.55));
}
.edge.is-selected.edge--automated .edge__shimmer {
  stroke-width: 2.4;
  opacity: 0.72;
}
.edge.is-selected.edge--ai .edge__line {
  stroke-width: 2.1;
  filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.7));
}
.edge.is-selected.edge--ai .edge__shimmer {
  stroke-width: 2.6;
}

/* Bidirectional AI edges — slightly softer pulse so it doesn't read
   as strongly directional when the edge is symmetrical. */
.edge--ai.edge--bidirectional .edge__shimmer {
  opacity: 0.7;
}

.edge--automated.edge--bidirectional .edge__shimmer {
  opacity: 0.4;
}

@keyframes edgeAutoDash {
  from { stroke-dashoffset: 0; }
  to   { stroke-dashoffset: -40; }
}

/* ============================================================
   DATA-TRANSFER EDGES (kind = "data")
   --------------------------------------------------------------
   Semantically distinct from process-flow edges: these represent
   pure information handoff between steps, not workflow progression.
   Visual signature: a dashed line rhythm. The dashes are applied to
   BOTH the base line AND the shimmer overlay so AI data-transfer
   edges still get their full rainbow flow effect, just rendered
   along a dashed path.

   The arrowhead markers and direction logic are unaffected — markers
   live at the path endpoints, which exist regardless of the dash
   pattern. Bidirectional edges still show two arrowheads.
   ============================================================ */
.edge--data .edge__line {
  /* 8px dash, 6px gap — clean, premium rhythm. Round linecaps soften
     each segment so it reads as engineering rather than warning. */
  stroke-dasharray: 8 6;
}
.edge--data .edge__shimmer {
  /* Match the base line's rhythm so the moving rainbow band reads
     as flowing along the same dashed path, not as a separate effect.
     Without this, the shimmer would be solid while the base is dashed —
     a visually incoherent mix. */
  stroke-dasharray: 8 6;
}

/* Selected data-transfer edges keep the dashed pattern — selection
   bumps weight and glow but never converts the line to solid, which
   would lose the kind affordance mid-interaction. */
.edge.is-selected.edge--data .edge__line {
  stroke-dasharray: 8 6;
}

/* ============================================================
   INSPECTOR
   ============================================================ */
.inspector {
  grid-area: inspector;
  background: var(--bg-elev-1);
  border-left: 1px solid var(--stroke-subtle);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.inspector__header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--stroke-subtle);
}
.inspector__eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.inspector__title {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: 24px;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--text-primary);
}
.inspector__title em {
  font-style: italic;
  background: linear-gradient(90deg, var(--ai-1), var(--ai-3));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.inspector__body { flex: 1; overflow-y: auto; padding: 18px 20px 28px; }
.inspector__empty {
  margin-top: 24px;
  color: var(--text-secondary);
  font-size: 12.5px; line-height: 1.6;
}
.inspector__empty .hint {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px dashed var(--stroke-soft);
  line-height: 1.7;
}

.conn { display: flex; flex-direction: column; gap: 14px; }

/* Edge type segmented toggle */
.edge-toggle {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px; padding: 4px;
  background: var(--bg-elev-2);
  border: 1px solid var(--stroke-subtle);
  border-radius: 10px;
  position: relative;
}
.edge-toggle button {
  padding: 9px 12px;
  border-radius: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: all 180ms ease;
  background: transparent;
  border: 1px solid transparent;
}
.edge-toggle button:hover { color: var(--text-secondary); }
.edge-toggle button.is-active {
  color: var(--text-primary);
  background: var(--bg-elev-3);
  border-color: var(--stroke-soft);
}
.edge-toggle button .pip {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--manual-stroke);
}
.edge-toggle.edge-toggle--3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.edge-toggle button.is-automated-option .pip { background: var(--auto-stroke); }
.edge-toggle button.is-ai-option .pip { background: var(--ai-3); }
.edge-toggle button.is-active.is-automated-option {
  background: linear-gradient(90deg, rgba(34,211,238,0.18), rgba(56,189,248,0.2));
  border-color: rgba(68,215,245,0.38);
  color: #d8faff;
}
.edge-toggle button.is-active.is-automated-option .pip { box-shadow: 0 0 6px var(--auto-stroke); }
.edge-toggle button.is-active.is-ai-option {
  background: linear-gradient(90deg, rgba(124,58,237,0.22), rgba(236,72,153,0.22));
  border-color: rgba(167,139,250,0.45);
  color: #f0d9ff;
}
.edge-toggle button.is-active.is-ai-option .pip { box-shadow: 0 0 6px var(--ai-3); }

.conn__route {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: var(--bg-elev-2);
  border: 1px solid var(--stroke-subtle);
  border-radius: var(--radius-md);
}
.conn__route .endpoint { flex: 1; min-width: 0; }
.conn__route .endpoint .label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-muted);
  display: block; margin-bottom: 3px;
}
.conn__route .endpoint .name {
  color: var(--text-primary); font-weight: 500; font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conn__route .arrow { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); font-size: 14px; }
.conn__route.is-ai .arrow {
  background: linear-gradient(90deg, var(--ai-1), var(--ai-3), var(--ai-4));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.conn__route.is-automated .arrow {
  color: var(--auto-stroke-sel);
  text-shadow: 0 0 8px rgba(68, 215, 245, 0.28);
}

.conn__field {
  display: flex; flex-direction: column; gap: 4px;
  padding-top: 12px;
  border-top: 1px solid var(--stroke-subtle);
}
.conn__field .k {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-muted);
}
.conn__field .v { font-size: 12.5px; color: var(--text-primary); line-height: 1.5; }
.conn__field .v.mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--accent); }

.inspector__body::-webkit-scrollbar { width: 6px; }
.inspector__body::-webkit-scrollbar-thumb { background: var(--stroke-soft); border-radius: 3px; }

/* ============================================================
   NODE INSPECTOR — form controls
   Reuses .conn-style layout but with editable inputs.
   ============================================================ */
.np { display: flex; flex-direction: column; gap: 14px; }

.np__field {
  display: flex; flex-direction: column; gap: 6px;
}
.np__field .k {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-muted);
}
.np__input,
.np__textarea {
  font-family: 'Inter Tight', sans-serif;
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-elev-2);
  border: 1px solid var(--stroke-subtle);
  border-radius: 8px;
  padding: 9px 11px;
  width: 100%;
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease;
  letter-spacing: -0.005em;
}
.np__input::placeholder,
.np__textarea::placeholder {
  color: var(--text-faint);
}
.np__input:hover,
.np__textarea:hover {
  border-color: var(--stroke-soft);
}
.np__input:focus,
.np__textarea:focus {
  border-color: rgba(167, 139, 250, 0.5);
  box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
  background: var(--bg-elev-3);
}
.np__textarea {
  resize: vertical;
  min-height: 96px;
  line-height: 1.5;
  font-size: 12.5px;
}
.np__input--mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.04em;
}

/* Reusable segmented control (used for type + shape) */
.np__seg {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px; padding: 4px;
  background: var(--bg-elev-2);
  border: 1px solid var(--stroke-subtle);
  border-radius: 10px;
}
.np__seg--3 { grid-template-columns: 1fr 1fr 1fr; }
.np__seg--3 button {
  /* Tighter padding to fit three labels comfortably */
  padding: 8px 6px;
  font-size: 9.5px;
  letter-spacing: 0.08em;
  gap: 5px;
  /* min-width:0 is essential inside a 1fr grid: without it, the button's
     intrinsic content width can push columns out of equal sizing.
     Combined with nowrap + overflow:hidden this guarantees the three
     buttons always render at exactly equal widths and never spill into
     each other, regardless of label length. */
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}
.np__seg button {
  padding: 8px 10px;
  border-radius: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: transparent;
  border: 1px solid transparent;
  transition: all 180ms ease;
}
.np__seg button:hover { color: var(--text-secondary); }
.np__seg button.is-active {
  color: var(--text-primary);
  background: var(--bg-elev-3);
  border-color: var(--stroke-soft);
}
.np__seg button .pip {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--manual-stroke);
}
.np__seg button.is-ai-option .pip { background: var(--ai-3); }
.np__seg button.is-active.is-ai-option {
  background: linear-gradient(90deg, rgba(124,58,237,0.22), rgba(236,72,153,0.22));
  border-color: rgba(167,139,250,0.45);
  color: #f0d9ff;
}
.np__seg button.is-active.is-ai-option .pip { box-shadow: 0 0 6px var(--ai-3); }

/* Tiny shape glyphs in the shape segmented control */
.np__shape-glyph {
  width: 10px; height: 10px;
  border: 1.5px solid currentColor;
  flex-shrink: 0;
}
.np__shape-glyph--process { border-radius: 2px; }
.np__shape-glyph--decision { transform: rotate(45deg); }
.np__shape-glyph--database { border-radius: 50% / 35%; }

/* Lightweight type pip beside the section title */
.np__type-pip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
  border: 1px solid var(--stroke-soft);
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
}
.np__type-pip.is-ai {
  background: linear-gradient(90deg, rgba(124,58,237,0.18), rgba(236,72,153,0.18));
  border-color: rgba(167,139,250,0.4);
  color: #f0d9ff;
}
.np__type-pip .pip {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--manual-stroke);
}
.np__type-pip.is-ai .pip {
  background: var(--ai-3);
  box-shadow: 0 0 5px var(--ai-3);
}

.np__id {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.08em;
}

/* ============================================================
   DANGER ZONE — destructive action button used at the bottom of
   selected-node and selected-edge inspectors.
   ============================================================ */
.np__danger {
  margin-top: 6px;
  padding-top: 14px;
  border-top: 1px dashed var(--stroke-soft);
}
.np__danger-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: #ff8a8a;
  background: rgba(255, 138, 138, 0.05);
  border: 1px solid rgba(255, 138, 138, 0.2);
  transition: all 160ms ease;
}
.np__danger-btn:hover {
  background: rgba(255, 138, 138, 0.12);
  border-color: rgba(255, 138, 138, 0.45);
  color: #ffb0b0;
  box-shadow: 0 0 16px -4px rgba(255, 138, 138, 0.4);
}
.np__danger-btn:active { transform: translateY(1px); }
.np__danger-btn svg { width: 12px; height: 12px; }

/* ============================================================
   CONNECTION HANDLES — small circular knobs on the four sides of
   each node. They appear on hover or while the node is selected so
   the canvas stays clean otherwise. Each handle carries data-side
   so the connection drag knows which anchor to use.

   For decision diamonds, side handles align to the diamond's
   vertices (the square footprint makes left/right handles fall
   exactly on the horizontal vertices, and we adjust top/bottom
   visually for a subtle offset cue).
   ============================================================ */
.node__conn {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--bg-elev-3);
  border: 1.5px solid var(--manual-stroke);
  cursor: crosshair;
  z-index: 5;
  pointer-events: auto;
  transition: opacity 160ms ease, transform 160ms ease,
              border-color 160ms ease, box-shadow 160ms ease;
  box-shadow: 0 0 0 2px var(--bg-base);
  opacity: 0;
}
/* Show handles when the node is hovered, selected, or actively
   being used as a connection source. */
.node:hover .node__conn,
.node.is-selected .node__conn,
.node--connecting .node__conn,
.node.is-drop-target .node__conn { opacity: 1; }

/* Side-specific positioning */
.node__conn[data-side="right"]  { right:  -6px; top:    50%; transform: translateY(-50%); }
.node__conn[data-side="left"]   { left:   -6px; top:    50%; transform: translateY(-50%); }
.node__conn[data-side="top"]    { top:    -6px; left:   50%; transform: translateX(-50%); }
.node__conn[data-side="bottom"] { bottom: -6px; left:   50%; transform: translateX(-50%); }

/* Inner pip indicates hover/active */
.node__conn::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  transition: opacity 160ms ease;
}
.node__conn:hover {
  border-color: var(--accent);
  box-shadow:
    0 0 0 2px var(--bg-base),
    0 0 12px rgba(167, 139, 250, 0.6);
}
.node__conn:hover::after { opacity: 1; }

/* AI variant — pink pip, slightly different border tint */
.node--ai .node__conn { border-color: rgba(167, 139, 250, 0.6); }
.node--ai .node__conn::after { background: var(--ai-3); }
.node--ai .node__conn:hover {
  box-shadow:
    0 0 0 2px var(--bg-base),
    0 0 14px rgba(236, 72, 153, 0.7);
}

/* Database variant — cyan pip to match the cylinder accent */
.node--database .node__conn::after { background: var(--db-accent); }
.node--database .node__conn:hover {
  border-color: var(--db-accent);
  box-shadow:
    0 0 0 2px var(--bg-base),
    0 0 12px var(--db-glow);
}
.node--database.node--ai .node__conn::after { background: var(--ai-3); }

/* When actively dragging a connection, scale up the source-side handle */
.node--connecting .node__conn[data-active="true"] {
  transform: scale(1.3);
}
/* Preserve the side translation while scaling — combine transforms via
   inline overrides on the active handle done in JS isn't needed because
   the side rules above use translateY/X; we layer scale via this rule. */
.node--connecting .node__conn[data-active="true"][data-side="right"]  { transform: translateY(-50%) scale(1.3); }
.node--connecting .node__conn[data-active="true"][data-side="left"]   { transform: translateY(-50%) scale(1.3); }
.node--connecting .node__conn[data-active="true"][data-side="top"]    { transform: translateX(-50%) scale(1.3); }
.node--connecting .node__conn[data-active="true"][data-side="bottom"] { transform: translateX(-50%) scale(1.3); }

/* Decision diamonds: nudge top/bottom handles inward slightly so they
   visually sit on the diamond's top/bottom vertex rather than floating
   above/below the bounding box. (Left/right vertices already coincide
   with the bounding box edges due to the square footprint.) */
.node--decision .node__conn[data-side="top"]    { top:    -4px; }
.node--decision .node__conn[data-side="bottom"] { bottom: -4px; }

/* Database cylinder: top handle should sit on the lid ellipse, bottom
   on the lower curve — both already align by default with the rounded
   borders of the ::before-less inner box, but pull them in slightly
   so they visually attach to the cylinder edge, not the bounding box. */
.node--database .node__conn[data-side="top"]    { top:    2px; }
.node--database .node__conn[data-side="bottom"] { bottom: 2px; }

/* ============================================================
   GENERATED DOCUMENTS PANEL
   A small "outputs" panel rendered as a SIBLING of each node
   (in the nodes-layer) — never as a child of the node itself,
   so it cannot inflate the node's offsetWidth/offsetHeight or
   throw off anchor-point calculations.

   Position is set via inline `transform: translate3d(x, y, 0)`
   from JS, mirroring the node's own positioning style.
   ============================================================ */
.node-docs {
  position: absolute;
  top: 0; left: 0;
  /* Card width is fixed so the layout stays predictable; height
     grows with the number of items. */
  width: 152px;
  padding: 7px 9px 8px;
  background: var(--bg-glass-strong);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--stroke-soft);
  border-radius: 9px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.03) inset,
    0 6px 20px rgba(0, 0, 0, 0.45);
  font-family: 'Inter Tight', sans-serif;
  /* The panel is a passive display element — it should never
     intercept clicks/drags meant for the node beneath it. */
  pointer-events: none;
  /* Default state is hidden; render mode adds .is-pinned (always
     visible) or .is-preview (shown only while node is hovered). */
  opacity: 0;
  transform-origin: left center;
  transition: opacity 140ms ease;
  z-index: 2;
}
.node-docs.is-pinned  { opacity: 1; }
.node-docs.is-preview { opacity: 0; }
.node-docs.is-preview.is-hovering { opacity: 1; }

.node-docs__title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.node-docs__list {
  list-style: none;
  margin: 0; padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.node-docs__item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--stroke-subtle);
  border-radius: 5px;
  font-size: 11px;
  line-height: 1.3;
  color: var(--text-primary);
  /* Long doc names truncate cleanly inside the fixed-width card. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.node-docs__icon {
  flex-shrink: 0;
  width: 10px; height: 12px;
  position: relative;
}
.node-docs__icon::before {
  /* Folded-corner document silhouette drawn entirely with CSS so we
     don't need an extra SVG sprite for this small UI affordance. */
  content: "";
  position: absolute;
  inset: 0;
  background: var(--text-muted);
  clip-path: polygon(0 0, 70% 0, 100% 30%, 100% 100%, 0 100%);
  border-radius: 1px;
}
.node-docs__icon::after {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 30%; height: 30%;
  background: var(--bg-elev-2);
  clip-path: polygon(0 0, 100% 100%, 0 100%);
}

/* Variant accents tied to the node's category — the panel borrows the
   accent of its owner. JS sets a class on the panel matching the node's
   type/shape so these rules pick the right tint. */
.node-docs--ai {
  border-color: rgba(167, 139, 250, 0.35);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.03) inset,
    0 6px 20px rgba(0, 0, 0, 0.45),
    0 0 16px -6px rgba(167, 139, 250, 0.5);
}
.node-docs--ai .node-docs__title { color: var(--accent); opacity: 0.9; }
.node-docs--ai .node-docs__icon::before { background: var(--ai-2); }

.node-docs--database {
  border-color: rgba(34, 211, 238, 0.25);
}
.node-docs--database .node-docs__title { color: var(--db-accent); opacity: 0.9; }
.node-docs--database .node-docs__icon::before { background: var(--db-accent); }

/* ============================================================
   CONNECTION PREVIEW EDGE — temporary dashed line during drag.
   pointer-events: none so it never blocks elementFromPoint.
   ============================================================ */
.edge-preview {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-dasharray: 6 5;
  opacity: 0.85;
  pointer-events: none;
  filter: drop-shadow(0 0 6px rgba(167, 139, 250, 0.5));
  animation: previewDash 0.9s linear infinite;
}
@keyframes previewDash {
  to { stroke-dashoffset: -22; }
}

/* Highlight a node when it's a valid drop target during connection drag */
.node.is-drop-target.node--manual {
  border-color: var(--accent) !important;
  box-shadow:
    0 0 0 2px var(--accent-glow),
    0 0 24px -4px rgba(167, 139, 250, 0.55) !important;
}
.node.is-drop-target.node--ai {
  box-shadow:
    0 0 0 2px rgba(236, 72, 153, 0.5),
    0 0 30px -2px rgba(124, 58, 237, 0.85) !important;
}
.node--decision.is-drop-target.node--manual::before {
  border-color: var(--accent) !important;
  box-shadow:
    0 0 0 2px var(--accent-glow),
    0 0 24px -4px rgba(167, 139, 250, 0.55) !important;
}

/* Node creation menu (split-button dropdown) */
.tbtn-group { position: relative; }
.tbtn-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 180px;
  padding: 5px;
  background: var(--bg-elev-2);
  border: 1px solid var(--stroke-soft);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02) inset;
  display: none;
  flex-direction: column;
  gap: 2px;
  z-index: 40;
}
.tbtn-menu.is-open { display: flex; }
.tbtn-menu button {
  padding: 9px 11px;
  border-radius: 7px;
  display: flex; align-items: center; gap: 10px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 12.5px;
  color: var(--text-primary);
  background: transparent;
  text-align: left;
  transition: background 140ms ease;
}
.tbtn-menu button:hover { background: var(--bg-elev-3); }
.tbtn-menu button .glyph {
  width: 14px; height: 14px;
  border: 1.5px solid var(--text-secondary);
  flex-shrink: 0;
}
.tbtn-menu button .glyph--process { border-radius: 3px; }
.tbtn-menu button .glyph--decision { transform: rotate(45deg); width: 11px; height: 11px; }
.tbtn-menu button .glyph--database {
  border-radius: 50% / 35%;
  border-color: var(--db-stroke);
}
.tbtn-menu button .lbl-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-left: auto;
}

/* ============================================================
   BOARD SIDEBAR
   ============================================================ */
.boards {
  grid-area: boards;
  background: var(--bg-elev-1);
  border-left: 1px solid var(--stroke-subtle);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.boards__header {
  padding: 18px 18px 12px;
  border-bottom: 1px solid var(--stroke-subtle);
}
.boards__eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.boards__title {
  font-family: 'Fraunces', serif;
  font-weight: 300; font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 12px;
}
.boards__title em {
  font-style: italic;
  background: linear-gradient(90deg, var(--ai-1), var(--ai-3));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.boards__newbtn {
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: #f0d9ff;
  background: linear-gradient(90deg, rgba(124,58,237,0.18), rgba(236,72,153,0.18));
  border: 1px solid rgba(167,139,250,0.4);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 160ms ease;
}
.boards__newbtn:hover {
  border-color: rgba(167,139,250,0.7);
  box-shadow: 0 0 16px rgba(167,139,250,0.25);
}
.boards__newbtn svg { width: 12px; height: 12px; }

.boards__list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px 28px;
  display: flex; flex-direction: column; gap: 8px;
}
.boards__list::-webkit-scrollbar { width: 6px; }
.boards__list::-webkit-scrollbar-thumb { background: var(--stroke-soft); border-radius: 3px; }

.board-card {
  background: var(--bg-elev-2);
  border: 1px solid var(--stroke-subtle);
  border-radius: var(--radius-md);
  padding: 12px 13px 11px;
  cursor: pointer;
  transition: all 180ms ease;
  position: relative;
  overflow: hidden;
}
.board-card:hover {
  border-color: var(--stroke-medium);
  background: var(--bg-elev-3);
}
.board-card.is-active {
  border-color: rgba(167,139,250,0.5);
  background: linear-gradient(180deg, rgba(124,58,237,0.10), rgba(20,23,35,0.6));
  box-shadow: 0 0 0 1px rgba(167,139,250,0.15) inset, 0 0 24px -8px rgba(167,139,250,0.45);
}
.board-card__head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 8px; margin-bottom: 8px;
}
.board-card__title {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 500; font-size: 13.5px;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  line-height: 1.25;
  flex: 1; min-width: 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.board-card__version {
  flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.08em;
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--stroke-soft);
  color: var(--text-secondary);
}
.board-card.is-active .board-card__version {
  background: linear-gradient(90deg, rgba(124,58,237,0.2), rgba(236,72,153,0.2));
  border-color: rgba(167,139,250,0.45);
  color: #f0d9ff;
}
.board-card__meta {
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.board-card__stats { display: flex; gap: 10px; }
.board-card__stats .ai-dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--ai-3);
  box-shadow: 0 0 5px var(--ai-3);
  margin-right: 4px;
  vertical-align: middle;
}
.board-card__date { color: var(--text-faint); }

/* Subtle delete on hover (only for non-active when count > 1) */
.board-card__del {
  position: absolute;
  top: 8px; right: 8px;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  color: var(--text-faint);
  opacity: 0;
  transition: opacity 160ms ease, background 160ms ease, color 160ms ease;
  background: var(--bg-elev-3);
}
.board-card:hover .board-card__del { opacity: 1; }
.board-card__del:hover { color: #ff8a8a; background: rgba(255,138,138,0.1); }
.board-card__del svg { width: 12px; height: 12px; }

/* ============================================================
   LEGEND + TOAST + STORAGE BANNER
   ============================================================ */
.legend {
  position: absolute;
  left: 20px; bottom: 18px;
  display: flex; gap: 16px;
  padding: 9px 13px;
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--stroke-subtle);
  border-radius: var(--radius-md);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-secondary);
  z-index: 5;
}
.legend .item { display: flex; align-items: center; gap: 7px; }
.legend .swatch { width: 20px; height: 2px; border-radius: 1px; }
.legend .swatch--manual { background: var(--manual-stroke); }
.legend .swatch--automated { background: linear-gradient(90deg, var(--auto-1), var(--auto-2)); box-shadow: 0 0 6px rgba(68,215,245,0.35); }
.legend .swatch--ai { background: linear-gradient(90deg, var(--ai-1), var(--ai-3), var(--ai-4)); box-shadow: 0 0 6px rgba(167,139,250,0.5); }

.toast {
  position: absolute;
  bottom: 18px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 8px 14px;
  background: var(--bg-glass-strong);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--stroke-soft);
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
  opacity: 0; pointer-events: none;
  transition: all 240ms cubic-bezier(.2,.8,.2,1);
  z-index: 50;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Save indicator (top-right of canvas) */
.save-indicator {
  position: absolute;
  top: 14px; right: 14px;
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--stroke-subtle);
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  z-index: 5;
}
.save-indicator .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--text-muted);
}
.save-indicator.is-saving .dot { background: #fbbf24; animation: livePulse 0.8s ease-in-out infinite; }
.save-indicator.is-saved .dot { background: #34d399; }
@keyframes livePulse { 0%,100% {opacity:1;} 50% {opacity:.35;} }

/* ============================================================
   EDGE DATA-FLOW TOOLTIP
   Compact floating panel that appears next to a hovered edge,
   showing the data items that flow along the connection.
   Single shared instance, repositioned in JS via inline left/top.
   ============================================================ */
.edge-tooltip {
  position: absolute;
  z-index: 25;
  min-width: 180px;
  max-width: 280px;
  padding: 10px 12px 11px;
  background: var(--bg-glass-strong);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--stroke-soft);
  border-radius: 10px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.03) inset,
    0 8px 28px rgba(0, 0, 0, 0.5),
    0 0 18px -8px rgba(167, 139, 250, 0.35);
  /* CRITICAL: pointer-events disabled so the tooltip can never steal
     hover from the underlying edge — that would cause the tooltip to
     disappear the moment the cursor crosses onto it, then reappear,
     creating a flicker loop. */
  pointer-events: none;
  font-family: 'Inter Tight', sans-serif;
  color: var(--text-primary);
  /* Fade in/out — opacity transition only, no transform that could
     be perceived as movement near the cursor. */
  opacity: 0;
  transition: opacity 140ms ease;
}
.edge-tooltip.is-visible { opacity: 1; }

.edge-tooltip__title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.edge-tooltip__route {
  font-size: 11.5px;
  color: var(--text-secondary);
  line-height: 1.35;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--stroke-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.edge-tooltip__route .from,
.edge-tooltip__route .to {
  color: var(--text-primary);
  font-weight: 500;
}
.edge-tooltip__route .arrow {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  margin: 0 6px;
}
.edge-tooltip.is-ai .edge-tooltip__route .arrow {
  background: linear-gradient(90deg, var(--ai-1), var(--ai-3), var(--ai-4));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.edge-tooltip__items {
  list-style: none;
  margin: 0; padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.edge-tooltip__items li {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
  line-height: 1.35;
  color: var(--text-primary);
}
.edge-tooltip__items li::before {
  content: "";
  display: inline-block;
  flex-shrink: 0;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
  transform: translateY(-2px);
}
.edge-tooltip.is-ai .edge-tooltip__items li::before {
  background: var(--ai-3);
  box-shadow: 0 0 4px var(--ai-3);
}
.edge-tooltip.is-automated .edge-tooltip__items li::before {
  background: var(--auto-stroke);
  box-shadow: 0 0 4px rgba(68, 215, 245, 0.55);
}

/* ============================================================
   EDGE LABELS — small pill rendered ON the edge path.
   One DOM element per edge that has a non-empty label, positioned via
   inline transform from JS using getPointAtLength on the SVG path.
   pointer-events: none so it never blocks edge selection or hover.
   ============================================================ */
.edge-label {
  position: absolute;
  z-index: 3;
  padding: 3px 9px;
  background: rgba(15, 17, 24, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--stroke-soft);
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-primary);
  white-space: nowrap;
  pointer-events: none;
  transform-origin: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}
.edge-label.is-ai {
  border-color: rgba(167, 139, 250, 0.4);
  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.4),
    0 0 12px -4px rgba(167, 139, 250, 0.5);
  color: #ede9fe;
}
.edge-label.is-automated {
  border-color: rgba(68, 215, 245, 0.34);
  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.4),
    0 0 12px -4px rgba(68, 215, 245, 0.42);
  color: #d8faff;
}

/* ============================================================
   WAYPOINT HANDLES
   Small draggable SVG <circle> elements rendered inside the edge
   group. Visible only when the edge is selected.
   ============================================================ */
.edge__waypoint {
  fill: var(--bg-base);
  stroke: var(--accent);
  stroke-width: 1.5;
  cursor: grab;
  opacity: 0;
  pointer-events: none;
  transition: opacity 120ms ease;
}
.edge.is-selected .edge__waypoint {
  opacity: 1;
  pointer-events: auto;
}
.edge__waypoint:hover {
  filter: drop-shadow(0 0 6px var(--accent-glow));
}
.edge__waypoint.is-dragging {
  cursor: grabbing;
  filter: drop-shadow(0 0 8px var(--accent-glow));
}
.edge__waypoint.is-selected {
  fill: var(--accent);
  stroke: #fff;
}
.edge--ai.is-selected .edge__waypoint {
  stroke: var(--ai-3);
}
.edge--ai.is-selected .edge__waypoint.is-selected {
  fill: var(--ai-3);
}
.edge--automated.is-selected .edge__waypoint {
  stroke: var(--auto-stroke);
}
.edge--automated.is-selected .edge__waypoint.is-selected {
  fill: var(--auto-stroke);
}
</style>

        <linearGradient id="aiFlowGradient" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">

        </linearGradient>

        <!-- AI EDGE PULSE GRADIENT — used by the shimmer overlay path.
             Transparent on both ends, AI rainbow in the middle. As the
             gradient's x1/x2 animate across the SVG viewport, the
             colored "energy packet" travels visibly from left to right
             over every AI edge in view. This is the actual rainbow flow
             effect that was missing from the previous white-dash
             shimmer. -->
        <linearGradient id="aiEdgePulseGradient" x1="-30%" y1="0%" x2="0%" y2="0%" gradientUnits="userSpaceOnUse">

               gradient enters from off-screen left and exits off-screen
               right, so each edge sees the full pulse pass through. -->
          <animate attributeName="x1" values="-30%;100%" dur="2.6s" repeatCount="indefinite"/>

             solid triangle. The fourth vertex creates the V-cut at the
             rear, which makes the arrowhead read as light and pointed
             rather than chunky. Tip is at (8.5, 5), so refX=8.5 keeps
             the tip exactly on the path endpoint.

             (6 default, 7 selected). The "lighter" feel of AI arrows

        <marker id="arrowAi"        viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1.5 L 8.5 5 L 1 8.5 L 2.5 5 Z" fill="#c4b5fd"/></marker>

<script>
/* ==============================================================
   AIFlow Workspace
   ==============================================================
   Data model
   ----------
   workspace = {
     boards: [{
       id, name,
       version: '1.0',
       createdAt, updatedAt,
       parentBoardId: null | id,    // for cloned versions, points to predecessor
       lineageRoot:   id,           // groups all versions descended from a single original
       data: { nodes, edges }
     }],
     activeBoardId
   }

  Each edge now stores its OWN type ('manual' | 'automated' | 'ai') — the
  per-edge toggle is independent from the source node's type.

   Persistence
   -----------
   `persist` is a thin wrapper around `window.storage` so we can swap
   implementations easily. Saves are debounced 350ms and surface via
   the save-indicator pill.

   Versioning
   ----------
   "Clone Version" deep-clones the active board and bumps the version:
     - same lineage  → minor bump (1.0 → 1.1 → 1.2 → ...)
     - new lineage   → starts at 1.0
     - holding shift → major bump (1.x → 2.0)  [bonus: shift-click]
   ============================================================== */

(() => {
  'use strict';

  // Captured before boot mutates the DOM. The HTML exporter patches this
  // pristine source so the downloaded file stays a clean standalone app.
  const INITIAL_HTML_SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  // ===== STORAGE LAYER ===========================================
  // Persistence uses standard browser localStorage so the workspace
  // survives across page reloads when the HTML file is opened directly
  // in Chrome / Edge / Safari (no special host environment required).
  //
  // Methods stay async to keep the rest of the app unchanged. Failures
  // are caught and reported through the return value (save) or a null
  // result (load), so the app can fall back to the default workspace
  // on first run or in environments where localStorage is unavailable
  // (e.g. Safari private mode quotas, sandboxed iframes, file://
  // contexts where the browser disabled storage).
  const STORAGE_KEY = 'aiflow:workspace:v1';

  // Probe localStorage once. Even when localStorage exists as an object,
  // setItem can throw (Safari private browsing, disabled cookies, quota).
  // If the probe fails we treat persistence as unavailable and fail
  // gracefully — the app still works in-memory for the current session.
  function _localStorageAvailable() {
    try {
      if (typeof localStorage === 'undefined') return false;
      const probeKey = '__aiflow_probe__';
      localStorage.setItem(probeKey, '1');
      localStorage.removeItem(probeKey);
      return true;
    } catch (e) {
      return false;
    }
  }
  const STORAGE_OK = _localStorageAvailable();
  if (!STORAGE_OK) {
    console.warn('[persist] localStorage unavailable — running in-memory only');
  }

  const persist = {
    async load() {
      if (!STORAGE_OK) return null;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw === null) return null;          // first run, no saved data
        return JSON.parse(raw);
      } catch (err) {
        // Corrupt JSON or read failure — fall back to defaults rather
        // than crashing the app on boot.
        console.warn('[persist.load]', err);
        return null;
      }
    },
    async save(data) {
      if (!STORAGE_OK) return false;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (err) {
        // Quota exceeded, security error, etc. — surface as failure so
        // the save indicator can show its non-saved state.
        console.warn('[persist.save]', err);
        return false;
      }
    }
  };

  function uid(prefix) {
    return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
