  // ============================================================
  // MIGRATION
  // Runs once on every boot. Adds new fields safely without
  // destroying existing data. Migrations should be idempotent —
  // running them twice must produce the same result.
  // ============================================================
  function migrateNode(n) {
    if (typeof n.shape !== 'string') n.shape = 'process';
    if (typeof n.sub   !== 'string') n.sub   = '';
    if (typeof n.kind  !== 'string') n.kind  = '';
    if (typeof n.title !== 'string') n.title = 'Untitled';
    if (typeof n.type  !== 'string') n.type  = 'manual';
    // Generated Documents — list of output file/document names that
    // this step produces. Older saved boards may not have these fields.
    // showDocuments controls whether the panel is pinned visible on the
    // canvas (vs. preview-on-hover only). Cap at 5 by trimming here in
    // case a board was saved with more (defensive — the inspector also
    // enforces the limit on input).
    if (!Array.isArray(n.documents))     n.documents = [];
    if (n.documents.length > 5)          n.documents = n.documents.slice(0, 5);
    if (typeof n.showDocuments !== 'boolean') n.showDocuments = false;
    return n;
  }
  function migrateEdge(e) {
    if (e.type !== 'manual' && e.type !== 'ai' && e.type !== 'automated') e.type = 'manual';
    if (typeof e.direction !== 'string')    e.direction = 'forward';
    if (typeof e.sourceAnchor !== 'string') e.sourceAnchor = 'auto';
    if (typeof e.targetAnchor !== 'string') e.targetAnchor = 'auto';
    if (!e.meta) e.meta = { protocol: '—', payload: '—', latency: 0, throughput: '—' };
    // Edge data flow — list of items transferred along the connection.
    // Older saved boards may not have this field; default to an empty array.
    if (!Array.isArray(e.dataItems)) e.dataItems = [];
    // Edge KIND — semantic classification:
    //   "process" → workflow step progression (default, solid line)
    //   "data"    → pure data/information handoff (dashed line)
    // Older saved edges default to "process" so existing workflows
    // render exactly as before.
    if (e.kind !== 'data' && e.kind !== 'process') e.kind = 'process';
    // Short label rendered as a pill on the path (e.g. "YES"/"NO" on
    // decision branches). Empty string = no label drawn.
    if (typeof e.label !== 'string') e.label = '';
    // Waypoints — purely visual routing controls (NOT semantic nodes).
    // Each is { x, y } in canvas coordinates. The edge stays a single
    // logical connection regardless of how many waypoints it has.
    // Validate the array shape carefully so a corrupt save can't crash
    // the renderer with NaN coordinates.
    if (!Array.isArray(e.waypoints)) e.waypoints = [];
    e.waypoints = e.waypoints
      .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number'
                && Number.isFinite(p.x) && Number.isFinite(p.y))
      .map(p => ({ x: p.x, y: p.y }));
    return e;
  }
  function migrateWorkspace(ws) {
    if (!ws || !Array.isArray(ws.boards)) return ws;
    ws.boards.forEach(b => {
      if (!b.data) b.data = { nodes: [], edges: [] };
      if (!Array.isArray(b.data.nodes)) b.data.nodes = [];
      if (!Array.isArray(b.data.edges)) b.data.edges = [];
      b.data.nodes.forEach(migrateNode);
      b.data.edges.forEach(migrateEdge);
    });
    return ws;
  }

  // ============================================================
  // STALE-DEFAULT DETECTION
  // ------------------------------------------------------------
  // Returns true if a saved workspace looks like a stale default
  // seed that should be replaced with the current embedded default.
  //
  // Heuristics (any one matches → stale):
  //   1. Contains a board literally named the old Customer Support
  //      Workflow demo. That demo is gone; nobody should still be
  //      seeing it.
  //   2. Looks like the older HRGI seed: a single board named
  //      'HR Onboarding · HRGI' (the legacy seedConfluenceBoardIfMissing
  //      title) AND missing the v1.1 marker nodes (Create Print-Ready
  //      Package, Prepare Additional Documents).
  //
  // We DO NOT replace if the workspace contains nodes that only exist
  // in the user's edits (e.g. titles they renamed, custom node ids).
  // The boolean intent here: "this is clearly an unedited old default".
  // ============================================================
  function looksLikeOldDefault(ws) {
    if (!ws || !Array.isArray(ws.boards) || ws.boards.length === 0) return true;

    // Old Customer Support demo — replace.
    const hasCustomerSupport = ws.boards.some(b =>
      typeof b.name === 'string' && /customer support workflow/i.test(b.name));
    if (hasCustomerSupport) return true;

    // Old HRGI seed: titled 'HR Onboarding · HRGI' (note the slightly
    // different separator from the new 'HR GMI IMBA · Onboarding').
    // The legacy seed produces exactly one board with that name; the
    // new embedded default uses a different title and includes v1.1
    // marker nodes. If we see the legacy title AND none of the marker
    // nodes exist anywhere in the workspace, it's the old seed.
    const hasLegacyTitle = ws.boards.some(b =>
      typeof b.name === 'string' && /HR Onboarding ·\s*HRGI/i.test(b.name));
    if (hasLegacyTitle) {
      const hasMarkerNode = ws.boards.some(b =>
        Array.isArray(b?.data?.nodes) &&
        b.data.nodes.some(n =>
          /Create Print-Ready Package/i.test(n.title || '') ||
          /Prepare Additional Documents/i.test(n.title || '') ||
          /AI-ready Entry List/i.test(n.title || '')
        )
      );
      if (!hasMarkerNode) return true;
    }

    return false;
  }

  // ============================================================
  // BOOT
  // ============================================================
  async function boot() {
    const saved = await persist.load();
    let savedRevision = null;
    try {
      if (typeof localStorage !== 'undefined') {
        savedRevision = localStorage.getItem(REVISION_KEY);
      }
    } catch (_) { /* ignore */ }

    let source = 'embedded-default';

    if (saved && saved.boards && saved.boards.length) {
      // We have a saved workspace. Decide whether to keep it or replace
      // with the embedded default.
      const revisionMatches = savedRevision === DEFAULT_WORKSPACE_REVISION;
      const stale = looksLikeOldDefault(saved);

      if (revisionMatches) {
        // User is on the current revision — always preserve their state.
        workspace = saved;
        source = 'localStorage';
      } else if (stale) {
        // Old default seed (Customer Support demo or legacy HRGI). The
        // user has not made meaningful edits; replace with the new
        // embedded default and stamp the revision marker so we don't
        // do this again on the next visit.
        workspace = defaultWorkspace();
        source = 'embedded-default (replaced stale ' +
                 (saved.boards.find(b => /customer support/i.test(b.name)) ? 'CustomerSupport' :
                  saved.boards.find(b => /HR Onboarding ·\s*HRGI/i.test(b.name)) ? 'legacyHRGI' :
                  'unknown') + ')';
      } else {
        // Saved workspace exists, doesn't match the current default
        // revision, but doesn't look like a stale default either —
        // i.e. the user has genuinely edited their workspace. Preserve
        // it. Stamp the revision so we don't re-evaluate every load.
        workspace = saved;
        source = 'localStorage (user-edited, kept across revision change)';
      }
    } else {
      // Nothing saved — pristine first-time visit.
      workspace = defaultWorkspace();
      source = 'embedded-default (no saved state)';
    }

    migrateWorkspace(workspace);

    // Validate active board still exists; fall back to first board.
    if (!workspace.boards.find(b => b.id === workspace.activeBoardId)) {
      workspace.activeBoardId = workspace.boards[0].id;
    }

    // Stamp the current revision in localStorage so subsequent loads
    // can short-circuit the stale check.
    try {
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem(REVISION_KEY, DEFAULT_WORKSPACE_REVISION);
      }
    } catch (_) { /* ignore */ }

    // Persist immediately if we just installed (or replaced with) the
    // embedded default, so a refresh stays consistent without waiting
    // for any user action.
    if (source.indexOf('embedded-default') === 0) {
      persist.save(workspace);
    }

    // Diagnostic: visible in DevTools so you can confirm what loaded.
    const active = workspace.boards.find(b => b.id === workspace.activeBoardId);
    try {
      console.log('[AIFlow] boot:', {
        source,
        defaultRevision: DEFAULT_WORKSPACE_REVISION,
        activeBoardId: workspace.activeBoardId,
        activeBoardName: active ? active.name : null,
        activeBoardVersion: active ? active.version : null,
        boardCount: workspace.boards.length,
      });
    } catch (_) { /* ignore */ }

    fullRender();

    // Hide loading veil
    requestAnimationFrame(() => {
      els.canvasLoading.classList.add('is-hidden');
      setTimeout(() => els.canvasLoading.style.display = 'none', 350);
    });

    // Save on unload as a safety net (in addition to debounced saves)
    window.addEventListener('beforeunload', () => {
      try { persist.save(workspace); } catch {}
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
